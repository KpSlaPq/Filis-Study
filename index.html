<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Bordeaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: schmale Seitenleiste + Lesespalte (1040px); auf dem Handy untere Tab-Leiste.
   Palette: tiefes Bordeaux, rosiges Elfenbein, Champagner als einziges Metall. Serife nur für große Titel. */
:root{
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#faf5f4; --bg-2:#f3e8e7; --surface:#ffffff; --surface-2:#fbf0f0;
  --line:rgba(94,20,40,.16); --line-2:rgba(94,20,40,.08);
  --text:#2a1017; --muted:#6a4750;
  --brand:#7a1630; --brand-2:#9a2442; --on-brand:#fdf3ef;
  --gold:#85601c; --rose:#a8324f;
  --good:#2c6a47; --warn:#85560a; --bad:#a3202f;
  --glow:rgba(154,36,66,.10); --glow2:rgba(133,96,28,.07);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 34px -20px rgba(70,10,28,.38);
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17080d; --bg-2:#1f0b13; --surface:#26111a; --surface-2:#311621;
    --line:rgba(255,226,232,.13); --line-2:rgba(255,226,232,.07);
    --text:#f7ece9; --muted:#cdb0b5;
    --brand:#8e1d38; --brand-2:#ad2a4c; --on-brand:#fff4f0;
    --gold:#e0bb86; --rose:#f0a9b6;
    --good:#8fc7a3; --warn:#e5b45a; --bad:#f29a98;
    --glow:rgba(173,42,76,.30); --glow2:rgba(224,187,134,.08);
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -22px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17080d; --bg-2:#1f0b13; --surface:#26111a; --surface-2:#311621;
  --line:rgba(255,226,232,.13); --line-2:rgba(255,226,232,.07);
  --text:#f7ece9; --muted:#cdb0b5;
  --brand:#8e1d38; --brand-2:#ad2a4c; --on-brand:#fff4f0;
  --gold:#e0bb86; --rose:#f0a9b6;
  --good:#8fc7a3; --warn:#e5b45a; --bad:#f29a98;
  --glow:rgba(173,42,76,.30); --glow2:rgba(224,187,134,.08);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -22px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 6% -10%,var(--glow),transparent 62%),radial-gradient(760px 520px at 104% 104%,var(--glow2),transparent 60%)}
#shell{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rose);text-underline-offset:3px}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* trilho */
#rail{position:sticky;top:0;height:100vh;padding:28px 18px 22px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line-2);background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 70%,transparent),transparent)}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px;text-decoration:none;color:var(--text)}
.logo svg{flex:none}
.logo b{font:600 25px/1 var(--serif);letter-spacing:.01em;display:block}
.logo small{display:block;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--surface-2);color:var(--text);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--gold),var(--rose))}
.nav a[data-nav="mehr"]{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.rail-foot p{font-size:13px;color:var(--muted);line-height:1.5}

main{min-width:0;padding:40px clamp(18px,4vw,56px) 80px}
#view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px;outline:none}

/* tipografia */
.display{font-family:var(--serif);font-weight:600;letter-spacing:-.012em;line-height:1.04;text-wrap:balance}
h1.display{font-size:clamp(36px,5.4vw,56px)}
h2.display{font-size:clamp(28px,3.4vw,36px)}
.display em{font-style:italic;color:var(--rose);font-weight:500}
.eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.lede{color:var(--muted);font-size:17.5px;max-width:62ch;text-wrap:pretty}
.muted{color:var(--muted)}
.small{font-size:14px}
.hair{height:1px;background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.5;border:0;margin:0}
.head{display:flex;flex-direction:column;gap:10px}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font:600 28px/1.1 var(--serif)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:13px 24px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;line-height:1;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .25s,background .2s,border-color .2s;background:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:var(--on-brand);box-shadow:0 12px 26px -14px var(--brand),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 16px 30px -14px var(--brand),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{border-color:var(--line);color:var(--text);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--gold)}
.btn.quiet{color:var(--muted);padding-inline:14px}
.btn.quiet:hover{color:var(--text);background:var(--surface-2)}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.btn.sm{min-height:40px;padding:10px 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;min-height:40px;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--gold);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--gold);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.pill.rose{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 50%,transparent)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* formulários */
label.f{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:600;color:var(--muted)}
.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;line-height:1.5;color:var(--text);transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
textarea.in{resize:vertical;min-height:110px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}

/* barras e anéis */
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .b-m{background:linear-gradient(90deg,var(--brand-2),var(--rose))}
.bar .b-l{background:color-mix(in srgb,var(--gold) 75%,transparent)}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring-bg{fill:none;stroke:var(--line-2);stroke-width:9}
.ring-fg{fill:none;stroke:var(--rose);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in b{font:600 40px/1 var(--serif)}
.ring-in small{font-size:12.5px;color:var(--muted);margin-top:4px}

/* início */
.hero-card{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,var(--surface)),var(--surface) 62%);border-color:color-mix(in srgb,var(--gold) 28%,var(--line))}
.hero-card h2{font:600 32px/1.1 var(--serif)}
.week{display:flex;gap:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.day i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:block}
.day.on i{background:linear-gradient(135deg,var(--brand-2),var(--rose));border-color:transparent}
.day.today i{border-color:var(--gold)}
.big{font:600 56px/1 var(--serif)}
.fc-bar{fill:color-mix(in srgb,var(--brand-2) 70%,transparent)}
.fc-today{fill:var(--rose)}
.fc-txt{fill:var(--muted);font:600 12px var(--sans)}
.exam{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.exam:first-child{border-top:0}
.exam .bar{grid-column:1/-1}
.cal-row{display:grid;grid-template-columns:120px 1fr 46px;gap:12px;align-items:center;font-size:14px}

/* matérias */
.sub-card{display:flex;flex-direction:column;gap:14px;cursor:default}
.sub-card h3{font:600 26px/1.1 var(--serif)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.crow{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 0;border-top:1px solid var(--line-2)}
.crow:first-child{border-top:0}
.crow .q{font-weight:600}
.crow .a{color:var(--muted);font-size:15px}
.crow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* sessão */
.ses-top{display:flex;align-items:center;gap:16px}
.ses-prog{flex:1;display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);font-weight:600}
.ses-prog .bar{flex:1}
.study{padding:clamp(26px,4vw,48px);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.study::before{content:"";position:absolute;left:clamp(26px,4vw,48px);right:clamp(26px,4vw,48px);top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.7}
.study .qtext{font:600 clamp(26px,3.6vw,38px)/1.18 var(--serif);text-wrap:balance}
.study .atext{font-size:19px;line-height:1.6;max-width:62ch}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.conf .btn{flex-direction:column;gap:4px;padding:14px 10px;min-height:64px}
.conf .btn small{font-weight:500;font-size:12.5px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grades .btn{flex-direction:column;gap:6px;padding:14px 8px;min-height:72px;border-radius:18px;border:1px solid var(--line)}
.grades .btn small{font-weight:500;font-size:12.5px;color:var(--muted)}
.grades .gr0{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.grades .gr1{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.grades .gr2{background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.grades .gr3{background:color-mix(in srgb,var(--good) 26%,transparent);border-color:color-mix(in srgb,var(--good) 70%,transparent)}
div.f{display:flex;flex-direction:column;gap:7px}
.f>span{font-size:14px;font-weight:600;color:var(--muted)}
.grades .btn:hover{transform:translateY(-2px)}
.why{border-left:2px solid var(--gold);padding:2px 0 2px 16px;color:var(--muted);font-size:16px}
.why b{color:var(--gold)}
.attempt{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:12px 15px;font-size:15px;color:var(--muted);white-space:pre-wrap}
kbd{font:600 11.5px var(--sans);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}

/* métodos */
.tier{display:flex;flex-direction:column;gap:14px}
.mcard{padding:0;overflow:hidden}
.mcard summary{list-style:none;cursor:pointer;padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
.mcard summary::-webkit-details-marker{display:none}
.mcard summary h3{font:600 27px/1.1 var(--serif)}
.mcard summary p{grid-column:1;color:var(--muted);font-size:15.5px;max-width:64ch}
.mcard summary .chev{grid-row:1/3;grid-column:2;color:var(--gold);transition:transform .25s;align-self:center}
.mcard[open] summary .chev{transform:rotate(90deg)}
.mbody{padding:0 26px 26px;display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.mbody h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.mbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.mbody .wide{grid-column:1/-1}
.cite{font-size:13px;color:var(--muted);line-height:1.5}
.cite li{margin-bottom:4px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ladder div{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.ladder b{display:block;font:600 22px/1.1 var(--serif);margin-bottom:4px}
.ladder span{font-size:13.5px;color:var(--muted);line-height:1.45;display:block}

/* foco */
.timer{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:36px 26px}
.timer .ring-in b{font-size:64px}
.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.plan-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.plan-row:first-child{border-top:0}

/* explicar */
.steps{display:flex;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.step i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12.5px}
.step.on{color:var(--text)}
.step.on i{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent;color:var(--on-brand)}
.step.done i{border-color:var(--gold);color:var(--gold)}
.check{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line-2);cursor:pointer}
.check:first-child{border-top:0}
.check input{appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);margin:2px 0 0;display:grid;place-items:center;background:var(--bg);cursor:pointer;transition:background .2s,border-color .2s}
.check input:checked{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent}
.check input:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--on-brand);border-bottom:2.5px solid var(--on-brand);transform:rotate(-48deg) translate(1px,-1px)}

/* sino de pétalas */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.petal{position:absolute;top:-24px;border-radius:70% 0 70% 0;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--surface-2);color:var(--text);border:1px solid var(--gold);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px);text-align:center}
#toast[hidden]{display:none}


/* quiz + formeln */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent);cursor:pointer;font-size:16px;line-height:1.45;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not([disabled]){border-color:var(--gold);background:var(--surface-2)}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.ok b{background:var(--good);border-color:transparent;color:var(--bg)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.no b{background:var(--bad);border-color:transparent;color:var(--bg)}
.fb{border-left:3px solid var(--gold);padding:4px 0 4px 16px}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fm-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 20px;padding:14px 0;border-top:1px solid var(--line-2);align-items:baseline}
.fm-row:first-child{border-top:0}
.fm{font:600 21px/1.35 var(--serif);color:var(--text);overflow-wrap:anywhere}
.fm-note{font-size:14px;color:var(--muted);grid-column:1/-1}
.qsets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.fm-row{grid-template-columns:1fr}.qsets{grid-template-columns:1fr}}

/* Tab-Leiste (Handy) */
#tabs{display:none}
@media (max-width:900px){
  #shell{grid-template-columns:minmax(0,1fr)}
  #rail{display:none}
  main{padding:26px 16px 120px}
  #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}

<script>(function(){'use strict';
/* ---------- Inhalte: Karteikarten aus den PDFs (Technische Mechanik 1, Prof. Engel / Prof. Laveuve) ---------- */
/* Format: [Frage, Antwort, Warum, Thema] */
const T01='01 Grundlagen',T02='02 Einführung in die Statik',T03='03 Zentrales ebenes Kraftsystem',T04='04 Allgemeines ebenes Kraftsystem',T05='05 Lagerungen',T06='06 Mehrkörpersysteme',TK='Klausur und PVL';
const SEED=[
 /* 01 Grundlagen */
 ["Womit beschäftigen sich Statik, Festigkeitslehre und Dynamik?","Statik: Gleichgewicht am Körper in Ruhe (Brücken, Strommasten, Hochregallager). Festigkeitslehre: Kräfte und Verformungen am elastisch verformbaren Körper. Dynamik (Kinematik/Kinetik): Untersuchung von bewegten Systemen.","Kräfte erkennt man an ihrer Wirkung: Körper im Gleichgewicht halten (Statik), Deformation eines Körpers (Festigkeitslehre), Masse in Bewegung versetzen oder den Bewegungszustand ändern (Dynamik).",T01],
 ["Wie sind TM1 und TM2 aufgeteilt?","TM1: Statik (1. Semester). TM2: Festigkeitslehre und Dynamik (2. Semester).","Ziel: einfache technische Probleme erkennen, richtig einordnen, in mechanische Berechnungsmodelle überführen und lösen.",T01],
 ["Welche vier Merkmale hat eine Kraft?","Eine Größe (Betrag), eine Richtung (Wirklinie), einen Richtungssinn (Orientierung) und einen Angriffspunkt.","Deshalb rechnet man mit Vektoren. Beispiel: Greift man einen Schrank zu hoch an, fällt er um, obwohl Betrag und Richtung gleich bleiben.",T01],
 ["Wie berechnet man die Gewichtskraft?","F_G = G = m · g, mit der Erdbeschleunigung g = 9,81 m/s².","Der Betrag der Gewichtskraft ist proportional zur Masse. Beispiel: 0,5 kg · 9,81 m/s² ≈ 4,9 N.",T01],
 ["Was ist die Einheit der Kraft?","Newton: 1 N = 1 kg · m/s².","Der Betrag einer beliebigen Kraft kann durch Vergleich mit der Gewichtskraft ermittelt werden (gleiche Verlängerung einer Feder).",T01],
 ["Wie lauten sin α, cos α und tan α im rechtwinkligen Dreieck?","sin α = Gegenkathete/Hypotenuse, cos α = Ankathete/Hypotenuse, tan α = Gegenkathete/Ankathete. Außerdem: cot α = 1/tan α.","Trigonometrie und Vektorrechnung sind die wichtigsten Werkzeuge der Technischen Mechanik.",T01],
 ["Welche Beziehungen gelten zwischen Sinus und Cosinus?","sin²α + cos²α = 1; cos(90° − α) = sin α; sin(90° − α) = cos α.","Damit lassen sich Komponenten und Winkel ineinander umrechnen.",T01],
 ["Wie bestimmt man einen Winkel aus einem Sinus-, Cosinus- oder Tangenswert?","Mit der Umkehrfunktion: α = arcsin x, α = arccos x bzw. α = arctan x.","Unterschiedliche Winkel liefern denselben sin-, cos- bzw. tan-Wert; der Taschenrechner gibt nur einen davon aus.",T01],
 ["Wie lauten Sinussatz und Cosinussatz im allgemeinen Dreieck?","Sinussatz: a/sin α = b/sin β = c/sin γ. Cosinussatz: a² = b² + c² − 2bc · cos α (entsprechend für b und c). Es gilt α + β + γ = 180°.","Drei gegebene Seiten ergeben alle Winkel. Zwei Seiten mit Zwischenwinkel ergeben die gegenüberliegende Seite.",T01],
 ["Wie addiert und subtrahiert man Vektoren grafisch und algebraisch?","Grafisch addiert man „Ende an Spitze“. Algebraisch addiert bzw. subtrahiert man zeilenweise die Komponenten. Subtraktion = Addition des mit −1 multiplizierten Vektors.","Die Multiplikation mit −1 kehrt den Richtungssinn des Pfeils um. Beide Wege liefern dasselbe Ergebnis.",T01],
 ["Wie multipliziert man einen Vektor mit einem Skalar k?","Jede Komponente wird mit k multipliziert: k · (v_x; v_y) = (k·v_x; k·v_y).","Multiplikation ist wiederholte Addition: 3·v = v + v + v.",T01],
 ["Wie ermittelt man den Betrag eines Kraftvektors aus seinen Komponenten?","Mit dem Satz des Pythagoras: F = √(F_x² + F_y²).","Die Komponenten bilden mit der Kraft ein rechtwinkliges Dreieck.",T01],
 ["Wie wird die Resultierende mehrerer Kräfte gebildet, und wo greift sie an?","Der Vektor der Resultierenden ist immer die Summe der Kraftvektoren. Bei gleichem Angriffspunkt ist das auch der Angriffspunkt der Resultierenden. Bei verschiedenen Angriffspunkten muss er gesondert bestimmt werden.","Die gesonderte Bestimmung der Wirklinie ist das Thema von Kapitel 04.",T01],
 ["Was sind Lageplan (LP), Freikörperbild (FKB) und Kräfteplan (KP)?","LP: auf das Wesentliche reduzierte Skizze, ein mechanisches Modell des realen Systems. FKB: entsteht aus dem LP durch gedachte Schnitte (Freischneiden) und macht interessante Kräfte sichtbar. KP: Vektordarstellung der Kräfteaddition.","Foto oder Skizze der Wirklichkeit, dann LP, dann FKB, dann Gleichgewichtsbedingungen (GGB).",T01],

 /* 02 Einführung in die Statik */
 ["Was untersucht die Statik?","Das Gleichgewicht am starren Körper.","Verformungen werden vernachlässigt: Wir tun so, als würde der Körper nicht verformt.",T02],
 ["Wie ist ein starrer Körper definiert?","Bei einem starren Körper bleiben auch unter der Wirkung beliebiger Kräfte alle materiellen Punkte in konstanter Entfernung zueinander.","Reale Körper sind nie ideal starr, können aber in vielen Fällen als starr angenommen werden.",T02],
 ["Wann ist ein am starren Körper angreifendes Kräftesystem im Gleichgewicht?","Wenn sich der Bewegungszustand des Körpers nicht ändert, er also z. B. in Ruhe ist und bleibt. Der Körper erfährt keine Beschleunigung.","In TM1 betrachten wir meist den einfachsten Fall: Der Körper ist und bleibt in Ruhe.",T02],
 ["Wann sind zwei Kräfte an einem Körper im Gleichgewicht?","Wenn sie gleich groß sind, entgegengesetzt gerichtet und auf derselben Wirklinie (WL) liegen.","Fehlt eine der drei Bedingungen, ist der Körper nicht im Gleichgewicht.",T02],
 ["Was ist eine Gleichgewichtsgruppe?","Eine Gruppe von Kräften, die einen starren Körper, auf den sie allein wirkt, im Gleichgewicht hält.","Ein freier starrer Körper im Gleichgewicht bleibt im Gleichgewicht, wenn man eine Gleichgewichtsgruppe hinzufügt oder entfernt.",T02],
 ["Was besagt der Verschiebungssatz?","Das Gleichgewicht eines freien starren Körpers ändert sich nicht, wenn man eine an ihm angreifende Kraft längs ihrer Wirkungslinie verschiebt.","Beweisidee: Man fügt eine Gleichgewichtsgruppe (F₃′ = F₃″ = F₃) hinzu und entfernt dann die ursprüngliche Kraft zusammen mit F₃′.",T02],
 ["Was besagt der Parallelogrammsatz?","Zwei Kräfte mit gleichem Angriffspunkt werden durch die Diagonale des aufgespannten Parallelogramms zur Resultierenden zusammengefasst. Ihr Angriffspunkt ist der der beiden Kräfte.","Die Diagonale beginnt am gemeinsamen Angriffspunkt.",T02],
 ["Wie verläuft die Resultierende im Kräfteplan?","Sie zeigt vom Fußpunkt des zuerst angetragenen Kraftvektors zur Spitze des zuletzt angetragenen Kraftvektors.","Die Reihenfolge der Vektoraddition ist egal: R₁₂ = F₁ + F₂ = F₂ + F₁. Umgekehrt kann man einen Vektor in mehrere andere zerlegen.",T02],
 ["Was besagt das Befreiungsprinzip nach Lagrange?","Das Gleichgewicht eines nicht freien, starren Körpers ändert sich nicht, wenn man ihn von den Bindungen mit seiner Umwelt befreit (freischneidet), solange man die Bindungen durch die von ihnen ausgeübten Kräfte ersetzt.","Die dadurch sichtbar gemachten Kräfte in den Bindungen heißen Schnittkräfte.",T02],
 ["Was ist ein Freikörperbild (FKB)?","Der vollständig (!) freigeschnittene Körper. Er hat keinen Kontakt mehr zu anderen Körpern; deren Wirkung ist durch die entsprechenden Kräfte ersetzt.","Das FKB ist die Grundlage für jede Gleichgewichtsbetrachtung.",T02],
 ["Was besagt das Wechselwirkungsprinzip?","Zu jeder auf einen Körper wirkenden Kraft existiert immer eine gleich große, auf der gleichen Wirklinie entgegengesetzt wirkende (Gegen-)Kraft, die an einem anderen Körper angreift.","Auch: Reaktionssatz, „actio = reactio“, 3. Newton’sches Axiom. Durch Freischneiden werden diese Kräfte an ihrem jeweiligen Schnittufer sichtbar.",T02],
 ["Welche Schnittkräfte entstehen bei der Berührung zweier glatter Körper?","Schnittkräfte senkrecht auf der gemeinsamen Tangentialebene, ins Innere der Körper gerichtet. Eine solche Kraft heißt Normalkraft (N).","Wären sie nach außen gerichtet, würden die Körper voneinander abheben.",T02],
 ["Was können Stäbe und Seile übertragen?","Nur Kräfte in ihrer Längsrichtung. Ein Stab überträgt Zug- und Druckkräfte, ein Seil nur Zugkräfte.","Beim Freischneiden liegt die Kraftrichtung in Längsrichtung des Seils bzw. Stabs.",T02],

 /* 03 Zentrales ebenes Kraftsystem */
 ["Was ist ein zentrales ebenes Kraftsystem?","Eine Gruppe von Kräften an einem starren Körper, bei der alle Kräfte in einer Ebene liegen und sich die Wirklinien aller Kräfte in einem Punkt schneiden.","Weil alle Wirklinien durch einen Punkt gehen, entsteht keine Drehwirkung (siehe Kapitel 04).",T03],
 ["Wie zerlegt man eine Kraft F_i in ihre Komponenten?","F_ix = F_i · cos α_i und F_iy = F_i · sin α_i. Der Winkel α ist der mathematisch positive Winkel (gegen den Uhrzeigersinn) zwischen positiver x-Richtung und Kraftrichtung.","Mit dieser Definition sind die Vorzeichen eindeutig: sin α ≥ 0 für 0° ≤ α ≤ 180°, cos α ≥ 0 für −90° ≤ α ≤ 90°.",T03],
 ["Wie berechnet man die Resultierende von n Kräften in Komponenten?","F_Rx = ΣF_ix und F_Ry = ΣF_iy (Summe über i = 1 … n).","Vektorschreibweise: F_R = F₁ + F₂ + … + F_n. Die Reihenfolge ist egal.",T03],
 ["Wie bestimmt man Betrag und Richtung der Resultierenden?","Betrag: F_R = √(F_Rx² + F_Ry²). Richtung: tan α_R = F_Ry/F_Rx, also α_R1 = arctan(F_Ry/F_Rx); zusätzlich möglich ist α_R2 = α_R1 + 180°.","Mit sin α_R = F_Ry/F_R prüft man: Die Lösung, die beide Gleichungen erfüllt, ist die richtige.",T03],
 ["Wann ist ein zentrales ebenes Kraftsystem im Gleichgewicht?","Wenn der Vektor der Resultierenden der Nullvektor ist: ΣF_ix = 0 (→) und ΣF_iy = 0 (↑).","Im Gleichgewicht ist das Kräftepolygon (Krafteck) geschlossen.",T03],
 ["Was ist ein Einheitsvektor, und wie schreibt man damit eine Kraft?","Ein Vektor mit Betrag 1. Es gilt F = F · e mit e = (cos α; sin α). In Komponenten: F = F_x · e_x + F_y · e_y.","Die Schreibweise mit Einheitsvektoren drückt dasselbe aus wie die Komponentenschreibweise.",T03],
 ["Wie lauten die Komponenten einer Kraft im Raum?","F_x = F · cos α · sin β, F_y = F · sin α · sin β, F_z = F · cos β. Betrag: F = √(F_x² + F_y² + F_z²).","α liegt in der xy-Ebene (gegen den Uhrzeigersinn von der positiven x-Richtung zur Projektion der Kraft). β wird von der positiven z-Richtung zur Kraft gemessen.",T03],
 ["Wie erhält man den Einheitsvektor einer Wirklinie durch die Punkte A und B im Raum?","e_AB = (1/L_AB) · (x_B − x_A; y_B − y_A; z_B − z_A) mit L_AB = √((x_B−x_A)² + (y_B−y_A)² + (z_B−z_A)²).","Die Kraft ist dann F = F · e_AB.",T03],
 ["Wie gehst du bei einer Aufgabe zum zentralen ebenen Kraftsystem vor?","1. Lageplan skizzieren. 2. Freikörperbild mit Koordinatensystem, Kräften, Winkeln und Bezeichnungen. 3. Gleichgewichtsbedingungen ΣF_x = 0 und ΣF_y = 0 aufstellen. 4. Komponenten mit Trigonometrie. 5. Einsetzen und lösen. Ein negatives Ergebnis bedeutet: Kraft wirkt entgegen der angenommenen Richtung.","Prüfe vorher: Anzahl der Unbekannten ≤ Anzahl der Gleichungen. Bei einem Stab: Zug (+) oder Druck (−).",T03],

 /* 04 Allgemeines ebenes Kraftsystem */
 ["Was ist ein allgemeines ebenes Kraftsystem?","Eine Gruppe von Kräften an einem starren Körper, wenn sie aus mindestens drei Kräften besteht, alle Kräfte in einer Ebene liegen und die Wirklinien keinen gemeinsamen Schnittpunkt haben.","Es gilt weiterhin F_R = ΣF_i, aber das liefert nicht die Wirklinie von F_R.",T04],
 ["Wie fasst man parallele Kräfte zusammen, obwohl der Parallelogrammsatz nicht anwendbar ist?","Man fügt eine Gleichgewichtsgruppe hinzu: zwei gleich große, entgegengesetzte Kräfte auf einer gemeinsamen Wirklinie senkrecht zu F₁ und F₂, mit beliebigem Betrag. Dann ergibt sich R₁₂ nach dem Parallelogrammsatz.","Beispiel Waage: Der Lagerpunkt muss auf der Wirklinie der Resultierenden der beiden Gewichtskräfte liegen. Die Lagerkraft hat den gleichen Betrag und die gleiche Wirklinie wie R₁₂.",T04],
 ["Wie lautet das Hebelgesetz des Archimedes?","F₁ · a₁ = F₂ · a₂.","Es folgt aus tan α₁ = a₁/h = F₂/F₁ und tan α₂ = a₂/h bei der Zusammenfassung zweier paralleler Kräfte.",T04],
 ["Was ist ein Kräftepaar?","Ein Paar paralleler Kräfte, die einander entgegengerichtet und gleich groß sind. Es kann nicht durch eine resultierende Kraft ersetzt werden und kann einen Körper nicht verschieben, aber drehen.","Beispiele: Lenkrad, Radkreuz. Der Abstand d der Wirklinien wird senkrecht zu diesen gemessen.",T04],
 ["Wie berechnet man das Moment eines Kräftepaars, und wie ist der Drehsinn definiert?","M = F · d, Einheit 1 Nm. Drehsinn (rechte-Hand-Regel): gegen den Uhrzeigersinn positiv, mit dem Uhrzeigersinn negativ.","Der Weg d ist der senkrechte Abstand und muss einen 90°-Winkel zur Wirklinie enthalten.",T04],
 ["Warum ist das Moment ein freier Vektor?","Am starren Körper darf es (anders als der Kraftvektor) auch senkrecht zu seiner Wirklinie verschoben werden, ohne dass sich die Wirkung ändert. Es steht senkrecht auf der vom Kräftepaar aufgespannten Ebene.","Das Moment ist (wie die Kraft) ein Vektor, Symbol M.",T04],
 ["Welche Eigenschaften hat ein Kräftepaar, und wie fasst man Momente zusammen?","Es ist auf seiner Wirklinie beliebig verschiebbar, die Richtung der Wirklinien ist beliebig, und es ist in seiner Ebene beliebig verschiebbar. M bleibt gleich, solange F · d gleich bleibt: M = F₁d₁ = F₂d₂. Momente in einer Ebene addiert man: M_ges = M₁ + … + M_n (Drehsinn beachten).","Ein Kräftepaar hat keinen bestimmten Angriffsort.",T04],
 ["Was ist ein Versetzungsmoment?","Die Parallelverschiebung einer Kraft F um die Strecke d am starren Körper erzeugt das Versetzungsmoment M = F · d.","Nach Hinzufügen der Gleichgewichtsgruppe wirkt auf den Körper die verschobene Kraft und ein Kräftepaar (Moment).",T04],
 ["Aus welchen zwei Schritten besteht die Wirkung eines allgemeinen ebenen Kraftsystems auf einen starren Körper?","1. Alle Kräfte in den Punkt A verschieben (zentrales Kräftesystem) und die Kräftesumme F_R = ΣF_i bilden. 2. Die Summe der Versetzungsmomente M_RA = ΣM_iA ermitteln, mit M_iA = x_i·F_iy − y_i·F_ix.","(x_i; y_i) ist der Angriffspunkt der Kraft F_i bezogen auf A.",T04],
 ["Wie lauten die Gleichgewichtsbedingungen im allgemeinen ebenen Kraftsystem?","ΣF_ix = 0 (→), ΣF_iy = 0 (↑) und ΣM_iA = 0 (↺, mit A als Bezugspunkt für das Momentengleichgewicht).","Im Gleichgewicht sind die resultierende Kraft F_R und das resultierende Moment M_R gleich null.",T04],
 ["Wie viele Unbekannte kann man aus den Gleichgewichtsbedingungen berechnen?","Höchstens drei: Es gibt unendlich viele Gleichgewichtsbedingungen, aber nur drei sind linear unabhängig. Davon können höchstens zwei für Kräfte, aber beliebig viele für Momente verwendet werden.","Bei drei Momentengleichungen dürfen die drei Bezugspunkte nicht auf einer Geraden liegen. Weitere Momentengleichungen dienen der Kontrolle.",T04],
 ["Warum gibt es im zentralen Kraftsystem keine Momentenwirkung der Kräfte?","Weil alle Kräfte im selben Punkt angreifen, kann man für alle Kräfte d = 0 wählen. Damit ist M = F · d = 0.","Da das Moment ein freier Vektor ist, muss dies auch für beliebige andere Bezugspunkte gelten.",T04],
 ["Wie wählt man den Bezugspunkt für das Momentengleichgewicht geschickt?","Man kann jeden beliebigen Punkt wählen, das Ergebnis bleibt gleich. Günstig ist ein Punkt, durch den unbekannte Kräfte laufen, denn deren Moment ist dann null.","Das Moment einer Kraft um A ist Kraft mal senkrechter Abstand zu A: M = F · d.",T04],
 ["Beispiel „Foto vom Beamer“: F₁ = 6 N (Abstand 0,15 m zu A, Drehsinn ↺), F₃ = 6 N (0,05 m, ↻), F₂ = 3 N (0,2 m, ↻). Ist der Körper im Gleichgewicht?","ΣM_A = 6 N · 0,15 m − 6 N · 0,05 m − 3 N · 0,2 m = 0,9 Nm − 0,3 Nm − 0,6 Nm = 0. Ja, der Körper dreht sich nicht.","Zum Gleichgewicht gehören auch ΣF_x = 0 und ΣF_y = 0. Das Festlager A wird durch seine Kräfte F_Ax und F_Ay ersetzt.",T04],
 ["Wie rechnet man die Kippbedingung beim Traktor mit Grubbermesser (Lagerkraft F_NA = 0)?","Momentengleichgewicht um B: −F_NA·(a + b) + F_G·b − F_last·h = 0. Mit F_NA = 0 folgt F_last = F_G · b/h.","Bei F_NA = 0 hebt der Traktor in A gerade ab. Die Aufgabe hat 4 Unbekannte und nur 3 Gleichungen, bis man F_NA = 0 als Grenzfall vorgibt.",T04],

 /* 05 Lagerungen */
 ["Wie viele Freiheitsgrade hat ein Starrkörper in der Ebene und im Raum?","In der Ebene drei (zwei Verschiebungen und eine Drehung). Im Raum sechs (Verschiebungen längs dreier orthogonaler Achsen und Drehungen um diese Achsen).","Ohne Lagerung kann sich der Körper beliebig verschieben und drehen. Lagerbedingungen reduzieren die Zahl der Freiheitsgrade.",T05],
 ["Was gibt die Wertigkeit eines Lagers an?","Wie viele Freiheitsgrade das Lager am jeweiligen Punkt wegnimmt: einwertig = 1, zweiwertig = 2, dreiwertig = 3.","Ein dreiwertiges Lager lässt in der Ebene keine Beweglichkeit mehr übrig.",T05],
 ["Was unterscheidet Auflager und Zwischenlager?","Auflager verbinden Starrkörper mit der Umgebung. Zwischenlager verbinden Starrkörper untereinander.","Beide übertragen Kräfte und/oder Momente und halten das System in definierten Positionen.",T05],
 ["Welche Wertigkeit und welche Reaktion hat ein Loslager?","Einwertig (W = 1): Es verhindert nur eine Bewegung und nimmt nur die Kraft senkrecht zur Auflagefläche auf.","Beim Rollenlager für Brücken gibt es für die horizontale Kraft und das Moment keine Lagerreaktion, weil das Lager ausweicht bzw. sich dreht.",T05],
 ["Welche Wertigkeit und welche Reaktionen hat ein Festlager?","Zweiwertig (W = 2): zwei Kraftkomponenten (z. B. F_Ax und F_Ay), aber kein Moment.","Das Festlager erlaubt die Drehung. Es lässt sich in zwei beliebige, zweckmäßig zueinander senkrechte Richtungen aufteilen.",T05],
 ["Welche Wertigkeit und welche Reaktionen hat die (feste) Einspannung?","Dreiwertig (W = 3): zwei Kraftkomponenten und ein Moment.","Es bleibt kein Freiheitsgrad übrig.",T05],
 ["Wie lautet der Zusammenhang zwischen Bewegungsmöglichkeit und Lagerreaktion?","Lagerreaktionen entstehen nur bezüglich der Richtungen, in denen das Lager die Bewegung verhindert. Die eingeschränkte Bewegungsmöglichkeit korrespondiert mit der übertragbaren Lagerreaktion.","Reaktionskräfte und -momente stellen sich so ein, dass sich das System im statischen Gleichgewicht befindet.",T05],
 ["Welche Wertigkeit haben Längsführung, Winkelführung und Gelenk?","Alle drei sind zweiwertig (W = 2). Längs- und Winkelführung können als Auflager oder als Zwischenlager vorkommen, das Gelenk als Zwischenlager.","Beispiel Längsführung: Kugelwagen auf einer Führungsschiene, bei dem Kippmoment und Kraft senkrecht zur Schiene zu prüfen sind.",T05],
 ["Was kann ein Gelenk nicht übertragen?","Momente. Es überträgt nur Kräfte (Längs- und Querkraft).","Das Gelenk ist zweiwertig, nicht dreiwertig.",T05],
 ["Wodurch lässt sich ein Loslager bzw. ein Festlager konstruktiv ersetzen?","Loslager: rechtwinklige Stabstütze (Pendelstütze), rechtwinkliges Seil, reibungsfreie Auflager oder Gleithülse. Festlager: zwei nicht zueinander senkrechte Pendelstützen.","Umgekehrt kann ein Festlager auch zwei Pendelstützen ersetzen.",T05],
 ["Was prüft man nach der Ermittlung der Lagerreaktionen?","Ob die Tragfähigkeit der Bauteile die Lagerreaktionen erträgt und ob die entstehenden Bewegungen und Verformungen mit der Funktion der Lagerungsbauteile vereinbar sind.","Beispiel: Ein Pendelrollenlager lässt nur eine kleine Winkelbewegung zu (z. B. ±2°). Die berechnete Winkelauslenkung (TM2) darf nicht größer sein.",T05],
 ["Was zeichnet man beim Freischneiden an Lagern ein?","Meist nur die starrkörperseitigen Kräfte und Momente, also die Lagerreaktionen, die am Körper angreifen.","Die Reaktionen der Umgebung bzw. des Gegenkörpers sind nach dem Wechselwirkungsprinzip gleich groß und entgegengesetzt.",T05],

 /* 06 Mehrkörpersysteme */
 ["Womit sind die Starrkörper eines Mehrkörpersystems verbunden?","Durch Zwischenlager.","Auflager verbinden Starrkörper und das Mehrkörpersystem mit der Umgebung.",T06],
 ["Was tust du, wenn ein Mehrkörpersystem vier unbekannte Auflagerreaktionen, aber nur drei unabhängige Gleichungen hat?","Du betrachtest die einzelnen Starrkörper: Jeder freigeschnittene Starrkörper liefert drei weitere Gleichgewichtsbedingungen.","Gleichgewichtsbedingungen können für das Gesamtsystem und für die einzelnen Starrkörper aufgestellt werden.",T06],
 ["Wie verhalten sich die Kräfte an den Schnittufern eines Zwischenlagers?","Sie sind gleich groß, aber entgegengerichtet (Wechselwirkungsprinzip).","So heben sie sich im Gesamtsystem auf.",T06],
 ["Was gilt, wenn alle einzelnen Starrkörper eines Mehrkörpersystems im Gleichgewicht sind?","Dann ist auch das Mehrkörpersystem im Gleichgewicht.","Umgekehrt gilt das Gesamtgleichgewicht allein nicht für jeden Körper.",T06],
 ["Wann kann man alle unbekannten Größen eines Starrkörpers oder Mehrkörpersystems lösen?","Wenn die Anzahl der unabhängigen Gleichungen mindestens der Anzahl der unbekannten Größen entspricht.","Genau gleich viele Unbekannte wie Gleichungen bedeutet statische Bestimmtheit (Kapitel 07).",T06],

 /* Klausur, PVL */
 ["Wie läuft die TM1-Klausur ab (Dauer, Hilfsmittel, Aufgaben)?","120 Minuten. Zugelassen: handelsüblicher Taschenrechner und 2 Seiten handgeschriebene Zusammenfassung des Skriptes. Nicht zugelassen: mobile Endgeräte. Jede Aufgabe zählt 20 Punkte.","Aufgabe 1: Multiple Choice zu Kapitel 1–6 (20 Fragen). Aufgabe 2: zentrales ebenes Kraftsystem. Aufgabe 3: Fachwerk. Aufgabe 4: Schwerpunkt. Aufgabe 5: Reibung/Haftung. Aufgabe 6: Schnittlasten am Balken.",TK],
 ["Wie ist eine Vorlesungseinheit in TM1 aufgebaut?","90 Minuten: 20 min Theorie, 20 min Übungsaufgabe vorrechnen, 30 min Übungsaufgabe ausführen, 20 min Lösung der Übungsaufgabe.","Selbst rechnen ist der Kern: Das entspricht dem Testen vor dem Nachschlagen.",TK],
 ["Was bedeutet statische Bestimmtheit, und was statische Unbestimmtheit?","Bestimmt: Die Summe der unbekannten Kräfte und Momente ist gleich der Anzahl der Gleichungen. Unbestimmt: Das System hat weniger Gleichungen als Unbekannte.","Aus den Gleichgewichtsbedingungen allein ist ein unbestimmtes System nicht lösbar.",TK],
 ["Was ist ein Nullstab im Fachwerk?","Ein Stab, der keine Kräfte überträgt.","Im idealen Fachwerk sind alle Knoten Gelenke, und die Stäbe nehmen nur Zug oder Druck auf.",TK],
 ["Wofür wird der Ritterschnitt verwendet?","Zur Analyse von Fachwerken.","Man schneidet das Fachwerk durch und stellt am Teilsystem die Gleichgewichtsbedingungen auf.",TK],
 ["Welche Einheit hat das Moment, und welche die Kraft?","Moment: Newtonmeter (Nm). Kraft: Newton (N).","M = F · d.",TK]
];

const QUIZ=[
 /* Muster-PVL */
 ['pvl',"Welche Aussage beschreibt die statische Bestimmtheit eines Systems?",["Die Anzahl der Stäbe ist größer als die Anzahl der Lagerreaktionen.","Die Summe der unbekannten Kräfte und Momente ist gleich der Anzahl der Gleichungen.","Das System ist unabhängig von äußeren Einflüssen stabil.","Die Lagerreaktionen sind identisch mit den einwirkenden Kräften."],1,"Statisch bestimmt heißt: Unbekannte = unabhängige Gleichgewichtsbedingungen. Mehr Unbekannte als Gleichungen wäre statisch unbestimmt."],
 ['pvl',"Wie lautet die Einheit der Kraft im internationalen Einheitensystem (SI)?",["Kilogramm (kg)","Newton (N)","Joule (J)","Pascal (Pa)"],1,"Die Einheit der Kraft ist das Newton: 1 N = 1 kg · m/s². Kilogramm ist die Einheit der Masse."],
 ['pvl',"Welches Prinzip liegt dem Freikörperdiagramm zugrunde?",["Das Prinzip der virtuellen Arbeit","Das Gleichgewicht der Kräfte","Das Superpositionsprinzip","Das Reziprozitätsprinzip"],1,"Im Skript heißt es Befreiungsprinzip nach Lagrange: Das Gleichgewicht ändert sich nicht, wenn man den Körper freischneidet und die Bindungen durch ihre Kräfte ersetzt. Die Auswertung geschieht über das Gleichgewicht der Kräfte. (Antwort aus dem Skript hergeleitet.)"],
 ['pvl',"Wie viele Lagerreaktionen besitzt ein Loslager?",["1","2","3","Keine"],0,"Das Loslager ist einwertig: Es nimmt nur die Kraft senkrecht zur Auflagefläche auf."],
 ['pvl',"Was beschreibt das Moment einer Kraft?",["Die Wirkung der Kraft entlang einer Linie.","Die Rotationswirkung einer Kraft um einen Punkt.","Die Schwerkraftwirkung einer Masse.","Die Entfernungskraft zwischen zwei Objekten."],1,"Das Moment (M = F · d) beschreibt die Drehwirkung, mit der eine Kraft einen Körper um einen Bezugspunkt zu drehen versucht."],
 ['pvl',"Welche Bedingung gilt für das Gleichgewicht eines starren Körpers?",["Alle Kräfte und Momente sind parallel.","Die Summe aller Kräfte und Momente ist null.","Die Summe aller Normal- und Tangentialkräfte ist gleich.","Die Rotationsachse bleibt konstant."],1,"Im Gleichgewicht sind die resultierende Kraft F_R und das resultierende Moment M_R gleich null: ΣF_x = 0, ΣF_y = 0, ΣM = 0."],
 ['pvl',"Was ist ein Nullstab in einem Fachwerk?",["Ein Stab, der keine Kräfte überträgt.","Ein Stab, der nur Zugkräfte überträgt.","Ein Stab, der nur Druckkräfte überträgt.","Ein Stab, der mit anderen Stäben identisch ist."],0,"Ein Nullstab führt im betrachteten Lastfall keine Stabkraft. (Fachwerke folgen in der Klausur als Aufgabe 3.)"],
 ['pvl',"Welche der folgenden ist keine Lagerart?",["Festlager","Loslager","Zwischenlager","Schiebelager"],3,"Im Skript kommen vor: Loslager, Festlager, Einspannung, Längs- und Winkelführung (Auflager) sowie Zwischenlager. Ein „Schiebelager“ wird nicht genannt."],
 ['pvl',"Wofür wird der Ritterschnitt verwendet?",["Zur Analyse von Fachwerken","Zur Berechnung von Drehmomenten","Zur Bestimmung der Schwerpunktlage","Zur Berechnung von Schubspannungen"],0,"Der Ritterschnitt ist ein Schnittverfahren zur Berechnung von Stabkräften in Fachwerken."],
 ['pvl',"Welche Aussage über die Resultierende ist korrekt?",["Die Resultierende ist die Summe aller Kräfte und Momente.","Die Resultierende ersetzt alle Einzelkräfte durch eine einzige Kraft.","Die Resultierende wirkt immer im Schwerpunkt des Körpers.","Die Resultierende kann keine Momente erzeugen."],1,"Der Vektor der Resultierenden ist die Summe der Kraftvektoren und ersetzt die Einzelkräfte. Seine Wirklinie muss beim allgemeinen Kraftsystem gesondert bestimmt werden."],
 ['pvl',"Was bedeutet statische Unbestimmtheit?",["Das System hat weniger Gleichungen als Unbekannte.","Das System hat mehr Gleichungen als Unbekannte.","Das System hat mehr Stäbe als notwendig.","Das System ist nicht stabil."],0,"Unbestimmt: weniger Gleichgewichtsbedingungen als Unbekannte. Die Gleichgewichtsbedingungen allein reichen dann nicht zur Lösung."],
 ['pvl',"Welche Aussage über ein Hebelgesetz ist korrekt?",["Der Drehpunkt hat keinen Einfluss auf die Kraftwirkung.","Der Hebelarm ist immer gleich der Last.","Das Produkt aus Kraft und Hebelarm ist konstant.","Hebel können keine Momente erzeugen."],2,"Hebelgesetz des Archimedes: F₁ · a₁ = F₂ · a₂. Das Produkt aus Kraft und Hebelarm (das Moment) ist auf beiden Seiten gleich."],
 ['pvl',"Welche Größen sind im Freikörperdiagramm darzustellen?",["Nur äußere Kräfte und Lagerreaktionen","Innere Kräfte, äußere Kräfte und Momente","Nur Momente und Lagerkräfte","Nur die Normalkraft"],0,"Im Freikörperbild erscheinen alle am freigeschnittenen Körper angreifenden Kräfte, also eingeprägte (äußere) Kräfte und die Lagerreaktionen bzw. Schnittkräfte. Innere Kräfte heben sich auf."],
 ['pvl',"Was ist das Ziel einer statischen Analyse?",["Die Berechnung von Beschleunigungen.","Die Analyse dynamischer Effekte.","Die Berechnung von Kräften und Momenten in Ruhe.","Die Identifikation von Temperaturfeldern."],2,"Die Statik untersucht das Gleichgewicht am Körper in Ruhe. Beschleunigungen gehören zur Dynamik."],
 ['pvl',"Welche Einheit hat das Moment im SI-System?",["Newton (N)","Newtonmeter (Nm)","Joule (J)","Watt (W)"],1,"M = F · d, also Newton mal Meter: 1 Nm."],
 ['pvl',"Welche Aussage beschreibt ein ideales Fachwerk?",["Es hat immer eine symmetrische Struktur.","Alle Knoten sind Gelenke, die nur Zug oder Druck aufnehmen.","Es hat mindestens drei Nullstäbe.","Es wird immer in einem einzigen Material gebaut."],1,"Im idealen Fachwerk sind die Knoten reibungsfreie Gelenke, und die Stäbe übertragen nur Zug- oder Druckkräfte in Längsrichtung."],
 ['pvl',"Was ist keine Annahme in der Technischen Mechanik I?",["Starre Körper","Reibungsfreie Lager","Unveränderliche Masse","Keine Gravitationskraft"],3,"Die Gewichtskraft F_G = m · g wird berücksichtigt. Starre Körper, idealisierte (reibungsfreie) Lager und konstante Masse sind übliche Modellannahmen."],
 ['pvl',"Wie viele Lagerreaktionen besitzt ein Festlager?",["1","2","3","Keine"],1,"Das Festlager ist zweiwertig: zwei Kraftkomponenten (F_x und F_y), kein Moment."],

 /* 02 */
 ['k02',"Womit beschäftigt sich die Statik?",["Statik untersucht das Gleichgewicht am elastischen Körper.","Statik untersucht das Gleichgewicht am starren Körper.","Statik untersucht das Gleichgewicht an zweidimensionalen Körpern.","Statik untersucht das Gleichgewicht an dreidimensionalen Körpern."],1,"Die Statik untersucht das Gleichgewicht am starren Körper; Verformungen werden vernachlässigt."],
 ['k02',"Wie ist ein starrer Körper definiert?",["Bei einem starren Körper bleiben auch unter der Wirkung beliebiger Kräfte alle materiellen Punkte in konstanter Entfernung zueinander.","Bei einem starren Körper bleiben unter der Wirkung sehr hoher Kräfte nicht alle materiellen Punkte in konstanter Entfernung zueinander.","Bei einem starren Körper bleiben unter der Wirkung beliebiger Kräfte alle materiellen Punkte in konstanter oder geringerer Entfernung zueinander.","Bei einem starren Körper bleiben auch unter der Wirkung sehr kleiner Kräfte nicht alle materiellen Punkte in konstanter Entfernung zueinander."],0,"Definition aus dem Skript: beliebige Kräfte, alle materiellen Punkte bleiben in konstanter Entfernung."],
 ['k02',"Ein starrer Körper ist in Ruhe, wenn …",["… er sich auf einer geraden Bahn bewegt.","… er sich nicht bewegt.","… er seine Geschwindigkeit nicht ändert.","… er langsamer wird."],1,"Ruhe heißt: keine Bewegung. Eine konstante Geschwindigkeit ist zwar auch ein Gleichgewichtszustand, aber nicht „in Ruhe“."],
 ['k02',"Ein an einem starren Körper angreifendes System von Kräften ist im Gleichgewicht, wenn …",["… der Körper in Ruhe bleibt.","… der Körper sich auf einer Kreisbahn bewegt.","… der Körper rotiert.","… kein Moment erzeugt wird."],0,"Gleichgewicht: Der Bewegungszustand ändert sich nicht, in TM1 meist: Der Körper ist und bleibt in Ruhe."],
 ['k02',"Was besagt der Satz vom Kräfteparallelogramm?",["Zwei am selben Punkt angreifende Kräfte können nie zu einer äquivalenten Kraft zusammengefasst werden.","Zwei an verschiedenen Punkten angreifende Kräfte können zu einer äquivalenten Kraft zusammengefasst werden.","Zwei am selben Punkt angreifende Kräfte heben sich immer gegenseitig auf.","Zwei am selben Punkt angreifende Kräfte können zu einer äquivalenten Kraft zusammengefasst werden."],3,"Parallelogrammsatz: Zwei Kräfte mit gleichem Angriffspunkt ergeben die Resultierende als Diagonale des Parallelogramms."],
 ['k02',"Wie bildet man ein Kräfteparallelogramm?",["Es wird die Diagonale des von den beiden Einzelkräften aufgespannten Parallelogramms gebildet. Die Resultierende greift im gleichen Punkt an.","Es wird die Parallele des von den beiden Einzelkräften aufgespannten Parallelogramms gebildet. Die Resultierende greift im gleichen Punkt an.","Es wird die Diagonale des von den beiden Einzelkräften aufgespannten Parallelogramms gebildet. Die Resultierende greift nicht im gleichen Punkt an.","Die Resultierende entspricht der doppelten Kraft der größten Einzelkraft."],0,"Die Diagonale ist die Resultierende, und ihr Angriffspunkt ist der gemeinsame Angriffspunkt der beiden Kräfte."],
 ['k02',"Wie verläuft die Resultierende im Kräfteplan?",["Im Kräfteplan zeigt die Resultierende stets vom Fußpunkt des zuerst angetragenen Einzelkraftvektors in die positive x-Richtung.","Im Kräfteplan zeigt die Resultierende stets von der Spitze des zuerst angetragenen Einzelkraftvektors zum Fußpunkt des zuletzt angetragenen Einzelkraftvektors.","Im Kräfteplan ist die Resultierende immer positiv.","Im Kräfteplan zeigt die Resultierende stets vom Fußpunkt des zuerst angetragenen Einzelkraftvektors zur Spitze des zuletzt angetragenen Einzelkraftvektors."],3,"Fußpunkt des ersten Vektors zur Spitze des letzten. Die Reihenfolge der Addition ist dabei egal."],
 ['k02',"Welche Aussage zum Satz vom Gleichgewicht der Kräfte ist wahr?",["Zwei Kräfte an einem Körper sind nicht im Gleichgewicht, wenn sie gleich groß sind, entgegengesetzt gerichtet und auf derselben Wirkungslinie liegen.","Zwei Kräfte an einem Körper sind im Gleichgewicht, wenn sie gleich groß sind, entgegengesetzt gerichtet und auf derselben Wirkungslinie liegen.","Zwei Kräfte an einem Körper sind im Gleichgewicht, wenn sie ungleich groß sind, entgegengesetzt gerichtet und auf derselben Wirkungslinie liegen.","Zwei Kräfte an einem Körper sind im Gleichgewicht, wenn sie gleich groß sind und entgegengesetzt gerichtet."],1,"Alle drei Bedingungen müssen erfüllt sein: gleich groß, entgegengesetzt gerichtet und dieselbe Wirklinie. Ohne gemeinsame Wirklinie entstünde ein Kräftepaar."],
 ['k02',"Was versteht man unter einer Gleichgewichtsgruppe?",["Eine Gruppe von Kräften, die sich – allein auf einen starren Körper wirkend – im Gleichgewicht hält.","Eine Gruppe von Kräften, die eine andere Gruppe von Kräften im Gleichgewicht hält.","Eine Kraft, die sich – allein auf einen starren Körper wirkend – im Gleichgewicht hält.","Eine Gruppe von Kräften, die einen Körper in Rotation versetzt."],0,"Definition: Gruppe von Kräften, die einen starren Körper, auf den sie allein wirkt, im Gleichgewicht hält. Eine einzelne Kraft kann das nicht."],
 ['k02',"Ändert sich das Gleichgewicht eines freien starren Körpers, wenn man eine Kraft längs ihrer Wirkungslinie verschiebt?",["Ja, da die Gleichgewichtsgruppe verändert wird.","Nein (Verschiebungssatz)"],1,"Verschiebungssatz: Das Gleichgewicht ändert sich nicht, wenn man eine Kraft längs ihrer Wirkungslinie verschiebt."],
 ['k02',"Was bedeutet das „Freischneiden“ eines Körpers?",["Das Gleichgewicht eines nicht freien, starren Körpers ändert sich, wenn man ihn von den Bindungen mit seiner Umwelt befreit, falls man nur die Bindungen durch die von ihnen ausgeübten Kräfte ersetzt.","Das Gleichgewicht eines Körpers ändert sich nicht, wenn man ihn von den Bindungen mit seiner Umwelt befreit.","Das Gleichgewicht eines nicht freien, starren Körpers ändert sich nicht, wenn man ihn von den Bindungen mit seiner Umwelt befreit, falls man nur die Bindungen durch Erdanziehungskräfte ersetzt.","Das Gleichgewicht eines nicht freien, starren Körpers ändert sich nicht, wenn man ihn von den Bindungen mit seiner Umwelt befreit, falls man nur die Bindungen durch die von ihnen ausgeübten Kräfte ersetzt."],3,"Befreiungsprinzip nach Lagrange: Die Bindungen müssen durch die von ihnen ausgeübten Kräfte (Schnittkräfte) ersetzt werden."],
 ['k02',"Was erhält man, wenn alle Bindungen eines Körpers freigeschnitten sind?",["Den Lageplan.","Den Kräfteplan.","Das Freikörperbild.","Die Skizze."],2,"Der vollständig freigeschnittene Körper heißt Freikörperbild (FKB)."],
 ['k02',"Was besagt der Satz vom Gegenwirkungsprinzip?",["Zu jeder auf einen Körper wirkenden Kraft existiert nur in sehr seltenen Fällen eine gleich große entgegengesetzt wirkende (Gegen-)Kraft, die an einem anderen Körper angreift.","Zu jeder auf einen Körper wirkenden Kraft existiert immer eine größere entgegengesetzt wirkende (Gegen-)Kraft, die an einem anderen Körper angreift.","Zu jeder auf einen Körper wirkenden Kraft existiert immer eine gleich große entgegengesetzt wirkende (Gegen-)Kraft, die am gleichen Körper angreift.","Zu jeder auf einen Körper wirkenden Kraft existiert immer eine gleich große entgegengesetzt wirkende (Gegen-)Kraft, die an einem anderen Körper angreift."],3,"Wechselwirkungsprinzip (actio = reactio): immer, gleich groß, entgegengesetzt, am anderen Körper. Am gleichen Körper würden sich die Kräfte nur aufheben."],
 ['k02',"Was für eine Schnittkraft entsteht, wenn sich zwei glatte Körper berühren?",["Es entsteht keine Schnittkraft, da die Körper glatt sind.","Es entsteht eine Schnittkraft senkrecht auf der gemeinsamen Tangentialebene, die ins Innere der Körper gerichtet ist.","Es entsteht eine Schnittkraft parallel auf der gemeinsamen Tangentialebene, die ins Innere der Körper gerichtet ist.","Es entsteht eine Schnittkraft parallel auf der gemeinsamen Tangentialebene, die von den Körpern aus nach außen gerichtet ist."],1,"Die Normalkraft N steht senkrecht auf der Tangentialebene und zeigt ins Innere der Körper, sonst würden sie abheben."],
 ['k02',"Was gilt für Seile und Stäbe?",["Ein Seil kann keine Zugkräfte übertragen, ein Stab kann Zug- und Druckkräfte übertragen.","Ein Seil kann nur Zugkräfte übertragen, ein Stab kann weder Zug- noch Druckkräfte übertragen.","Ein Seil kann nur Zug- und Druckkräfte übertragen, ein Stab kann Druckkräfte übertragen.","Ein Seil kann nur Zugkräfte übertragen, ein Stab kann Zug- und Druckkräfte übertragen."],3,"Seile: nur Zug. Stäbe: Zug und Druck, jeweils nur in Längsrichtung."],

 /* 03 */
 ['k03',"Was bedeutet zentrales ebenes Kraftsystem?",["Mehrere Kräfte liegen in einer gemeinsamen Ebene und die Wirkungslinien schneiden sich in einem Punkt.","Mehrere Kräfte liegen in einer gemeinsamen Ebene und die Wirkungslinien schneiden sich nicht.","Eine Kraft liegt in einer 2-dimensionalen Ebene und die Wirkungslinie schneidet den Ursprung.","Mehrere Kräfte liegen in verschiedenen Ebenen und es gibt verschiedene Schnittpunkte der Wirkungslinien."],0,"Alle Kräfte in einer Ebene, alle Wirklinien schneiden sich in einem Punkt."],
 ['k03',"Welche Aussage über eine Kraft im zentralen ebenen Kraftsystem ist wahr?",["Eine Kraft ist ein Vektor und ist zusätzlich durch einen Pfeil gekennzeichnet.","Eine Kraft ist ein Vektor. Sie besteht im zweidimensionalen Raum immer aus zwei Komponenten, F_X und F_Y.","Eine Kraft ist ein Vektor. Sie besteht im zweidimensionalen Raum meistens aus zwei Komponenten, F_X und F_Y.","Eine Kraft ist ein Pfeil und wird daher auch Vektor genannt."],1,"In der Ebene hat jeder Kraftvektor immer zwei Komponenten (F_x und F_y); eine davon kann null sein."],
 ['k03',"Wie berechnet man im zentralen ebenen Kraftsystem die resultierende Kraft F_R?",["Durch Addition der einzelnen Kraftvektoren.","Durch den Satz des Pythagoras.","Ausschließlich durch grafische Zerlegung.","Durch Addition der einzelnen Kraftbeträge."],0,"F_R = F₁ + F₂ + … (Vektoraddition, komponentenweise). Der Satz des Pythagoras liefert erst danach den Betrag."],
 ['k03',"Was bedeutet es, wenn ein System „in Ruhe“ ist?",["ΣF ≤ 0","Das System befindet sich nicht im Gleichgewicht.","Der Summand aller Kräfte ist gleich 0.","ΣF = 0"],3,"In Ruhe bzw. im Gleichgewicht ist die Summe aller Kräfte null: ΣF = 0."],
 ['k03',"Woraus besteht ein Freikörperbild?",["Aus allen wirkenden Kräften.","Aus allen wirkenden Kräften und dazugehörigen Winkeln.","Aus allen wirkenden Kräften, dazugehörigen Winkeln, Bezeichnungen und einem Koordinatensystem.","Aus allen wirkenden Kräften, dazugehörigen Winkeln, Bezeichnungen, einem Koordinatensystem und der Erdanziehungskraft."],2,"Ein brauchbares FKB enthält Kräfte, Winkel, Bezeichnungen und ein Koordinatensystem. Die Erdanziehung erscheint nur als Gewichtskraft, wenn sie am Körper wirkt."],
 ['k03',"Das Aufstellen welcher Gleichung(en) ist immer der erste Schritt bei der Lösung von Aufgaben zum zentralen ebenen Kraftsystem?",["Sinus- und Cosinussatz.","Summe der Kräfte in x- und y-Richtung.","Satz des Pythagoras.","Berechnung der fehlenden Winkel."],1,"Zuerst kommen die Gleichgewichtsbedingungen ΣF_x = 0 und ΣF_y = 0; erst danach löst man sie nach den Unbekannten."],

 LT('Starrer Körper und Gleichgewicht',[
  'Die Statik untersucht das **Gleichgewicht am starren Körper**. Bei einem starren Körper werden Verformungen vernachlässigt: Wir tun so, als würde der Körper nicht verformt. Genauer: Auch unter beliebigen Kräften bleiben alle materiellen Punkte in konstanter Entfernung zueinander. Reale Körper sind nie ideal starr, lassen sich aber oft so behandeln.',
  'Ändert sich der Bewegungszustand nicht (der Körper ist z. B. in Ruhe und bleibt es), ist das Kräftesystem **im Gleichgewicht**, und der Körper erfährt keine Beschleunigung. Ändert er sich, ist es nicht im Gleichgewicht: Die Bewegung ändert Betrag und Richtung, oder eine Drehbewegung kommt hinzu. In TM1 betrachten wir meist den einfachsten Fall: Der Körper ist und bleibt in Ruhe.'],
  'Gleichgewicht = Bewegungszustand ändert sich nicht (meist: Ruhe).'),
 LC('Was zeichnet einen starren Körper aus?',['Er wird unter hohen Kräften kürzer','Alle materiellen Punkte bleiben in konstantem Abstand','Er hat keine Masse','Er kann nur in Ruhe sein'],1,'Beim starren Körper bleiben auch unter beliebigen Kräften alle materiellen Punkte in konstanter Entfernung zueinander.'),
 LT('Gleichgewicht zweier Kräfte',[
  'Zwei Kräfte F₁ und F₂ an einem Körper sind im Gleichgewicht, wenn **alle drei** Bedingungen erfüllt sind: gleich groß, entgegengesetzt gerichtet und auf **derselben Wirklinie** (WL).',
  'Fehlt eine Bedingung, ist der Körper nicht im Gleichgewicht. Liegen zwei gleich große, entgegengesetzte Kräfte auf parallelen, aber verschiedenen Wirklinien, dreht sich der Körper (Kräftepaar, Kapitel 04).'],
  'Gleich groß + entgegengesetzt + gleiche Wirklinie.'),
 LC('Zwei Kräfte mit je 100 N wirken entgegengesetzt, aber auf zwei parallelen, versetzten Wirklinien. Ist der Körper im Gleichgewicht?',['Ja, die Beträge sind gleich','Ja, weil sie entgegengesetzt sind','Nein, denn sie liegen nicht auf derselben Wirklinie','Nein, weil 100 N zu groß ist'],2,'Alle drei Bedingungen müssen gelten. Ohne gemeinsame Wirklinie entsteht ein Kräftepaar, das den Körper dreht.'),
 LT('Gleichgewichtsgruppe und Verschiebungssatz',[
  'Eine **Gleichgewichtsgruppe** ist eine Gruppe von Kräften, die einen starren Körper, auf den sie allein wirkt, im Gleichgewicht hält. Ein freier starrer Körper im Gleichgewicht bleibt im Gleichgewicht, wenn du eine Gleichgewichtsgruppe hinzufügst oder entfernst.',
  'Daraus folgt der **Verschiebungssatz**: Das Gleichgewicht eines freien starren Körpers ändert sich nicht, wenn man eine Kraft längs ihrer Wirkungslinie verschiebt.',
  'Beweisidee: Gegeben sind F₁, F₂ und F₃ im Gleichgewicht. Du fügst F₃′ und F₃″ hinzu (beide gleich F₃, entgegengesetzt, auf derselben Wirklinie). Danach bilden das ursprüngliche F₃ und F₃′ eine Gleichgewichtsgruppe und können entfernt werden. Übrig bleibt F₃″ an einem verschobenen Angriffspunkt.'],
  'Kraft längs der Wirklinie verschieben: erlaubt. Quer dazu: nicht.'),
 LC('Darf man eine Kraft am starren Körper längs ihrer Wirkungslinie verschieben, ohne das Gleichgewicht zu ändern?',['Ja (Verschiebungssatz)','Nein, nur bei Kräftepaaren','Nur senkrecht zur Wirklinie','Nur bei Zugkräften'],0,'Verschiebungssatz: Das Gleichgewicht ändert sich nicht, wenn man die Kraft längs ihrer Wirklinie verschiebt.'),
 LT('Parallelogrammsatz und Kräfteplan',[
  'Zwei Kräfte mit gleichem Angriffspunkt fasst du zusammen: Die **Diagonale des aufgespannten Parallelogramms** ist die Resultierende R₁₂, und ihr Angriffspunkt ist der gemeinsame Angriffspunkt.',
  'Als Vektorzeichnung ist das der **Kräfteplan (KP)**, auch Kräftedreieck oder Krafteck genannt: Du trägst die Vektoren hintereinander an. Die Resultierende zeigt vom **Fußpunkt des zuerst angetragenen** Vektors zur **Spitze des zuletzt angetragenen** Vektors. Die Reihenfolge ist egal. Umgekehrt kannst du einen Kraftvektor in mehrere andere zerlegen, deren Summe er ist.'],
  'R₁₂ = F₁ + F₂ = F₂ + F₁'),
 LC('Wie verläuft die Resultierende im Kräfteplan?',['Von der Spitze des ersten zum Fußpunkt des letzten Vektors','Vom Fußpunkt des ersten zur Spitze des letzten Vektors','Immer in positive x-Richtung','Parallel zum längsten Vektor'],1,'Fußpunkt des zuerst angetragenen Vektors bis Spitze des zuletzt angetragenen Vektors.'),
 LT('Freischneiden: Befreiungsprinzip und Freikörperbild',[
  'Reale Körper sind mit ihrer Umwelt verbunden (Lager, Seile, Berührung). Das **Befreiungsprinzip nach Lagrange**: Das Gleichgewicht eines nicht freien, starren Körpers ändert sich nicht, wenn man ihn von den Bindungen befreit (freischneidet), solange man die Bindungen durch die von ihnen ausgeübten Kräfte ersetzt. Diese sichtbar gemachten Kräfte heißen **Schnittkräfte**.',
  'Der **vollständig** (!) freigeschnittene Körper ist das **Freikörperbild (FKB)**. Er hat keinen Kontakt mehr zu anderen Körpern. Deren Wirkung ist durch die entsprechenden Kräfte ersetzt. Aus dem Lageplan (LP) wird so das FKB, an dem du die Gleichgewichtsbedingungen aufstellst.'],
  'Freischneiden: Bindung weg, Kraft statt Bindung einzeichnen.'),
 LC('Was ist ein Freikörperbild?',['Eine Foto der Wirklichkeit','Der vollständig freigeschnittene Körper mit den ersetzten Kräften','Die Vektorzeichnung der Kräfteaddition','Eine Skizze ohne Kräfte'],1,'Das FKB ist der vollständig freigeschnittene Körper. Die Wirkung der Umgebung ist durch Kräfte ersetzt.'),
 LT('Wechselwirkungsprinzip, glatte Flächen, Stäbe und Seile',[
  '**Wechselwirkungsprinzip** (actio = reactio, 3. Newton’sches Axiom): Zu jeder auf einen Körper wirkenden Kraft gibt es immer eine gleich große, entgegengesetzt wirkende Gegenkraft auf derselben Wirklinie. Sie greift an einem **anderen** Körper an. Beim Freischneiden werden diese Kräfte an ihrem jeweiligen Schnittufer sichtbar.',
  '**Berührung zweier glatter Körper**: Die Schnittkräfte stehen senkrecht auf der gemeinsamen Tangentialebene und zeigen ins Innere der Körper (sonst würden die Körper abheben). Eine solche Kraft heißt **Normalkraft N**.',
  '**Stäbe und Seile** übertragen nur Kräfte in ihrer Längsrichtung. Ein Stab überträgt Zug und Druck, ein Seil nur Zug. Beim Freischneiden liegt die Kraftrichtung deshalb in Längsrichtung.'],
  'Seil: nur Zug. Stab: Zug und Druck. Beide: nur in Längsrichtung.'),
 LC('Was kann ein Seil übertragen?',['Zug- und Druckkräfte','Nur Druckkräfte','Nur Zugkräfte in Längsrichtung','Zug und Momente'],2,'Ein Seil überträgt nur Zugkräfte, und zwar in Längsrichtung. Ein Stab überträgt Zug und Druck.')
]},

{id:'k03',titel:'03 Zentrales ebenes Kraftsystem',kurz:'Komponenten, Resultierende, Gleichgewicht, Stabkräfte',min:35,quelle:'Skript 03 und Vorlesungsbeispiele (Baum-Aufgabe, Stabkräfte)',steps:[
 LT('Was ist ein zentrales ebenes Kraftsystem?',[
  'Eine Gruppe von Kräften an einem starren Körper heißt zentrales ebenes Kraftsystem, wenn **alle Kräfte in einer Ebene liegen** und sich die **Wirklinien aller Kräfte in einem Punkt schneiden**.',
  'Weil alle Wirklinien durch einen Punkt gehen, entsteht keine Drehwirkung. Es genügen deshalb Kräftegleichungen. Die Resultierende ist F_R = F₁ + F₂ + … + F_n, in beliebiger Reihenfolge.'],
  'Eine Ebene + ein gemeinsamer Schnittpunkt der Wirklinien.'),
 LT('Komponenten einer Kraft',[
  'Der Winkel α ist der **mathematisch positive Winkel** (gegen den Uhrzeigersinn) zwischen der positiven x-Richtung und der Kraftrichtung. Mit dieser Definition sind die Vorzeichen eindeutig.',
  'Vorzeichen: sin α ist ≥ 0 für 0° ≤ α ≤ 180° und < 0 für 180° < α < 360°. cos α ist ≥ 0 für −90° ≤ α ≤ 90° und < 0 für 90° < α < 270°. Den Betrag erhältst du mit Pythagoras.'],
  'Winkel immer von der positiven x-Achse gegen den Uhrzeigersinn messen.',
  ['F_ix = F_i · cos α_i','F_iy = F_i · sin α_i','F_i = √(F_ix² + F_iy²)']),
 LC('Eine Kraft von 100 N hat den Winkel α = 180°. Wie groß sind F_x und F_y?',['F_x = 100 N, F_y = 0','F_x = −100 N, F_y = 0','F_x = 0, F_y = 100 N','F_x = 0, F_y = −100 N'],1,'cos 180° = −1 und sin 180° = 0. Die Kraft zeigt also genau in negative x-Richtung.'),
 LT('Resultierende: Betrag und Richtung',[
  'Du addierst die Komponenten aller Kräfte. Danach berechnest du Betrag und Richtung der Resultierenden.',
  'Für die Richtung gibt es zwei Lösungen, weil tan α_R für α_R1 und α_R1 + 180° gleich ist. Mit **sin α_R = F_Ry / F_R** prüfst du: Die Lösung, die beide Gleichungen erfüllt, ist die richtige.'],
  'Immer mit der Skizze prüfen, in welchem Quadranten die Resultierende liegt.',
  ['F_Rx = ΣF_ix ,  F_Ry = ΣF_iy','F_R = √(F_Rx² + F_Ry²)','tan α_R = F_Ry / F_Rx  →  α_R1 = arctan(F_Ry / F_Rx)','α_R2 = α_R1 + 180°']),
 LB('Beispiel: Resultierende zweier Seilkräfte (nach der Baum-Aufgabe)','F₁ = 5000 N unter α₁ = 40° und F₂ = 4500 N unter α₂ = 70° zur positiven x-Achse','a) Resultierende F_R  b) Richtung α_R',[
  ['Komponenten von F₁','F₁x = 5000 N · cos 40° ≈ 3830 N;  F₁y = 5000 N · sin 40° ≈ 3214 N'],
  ['Komponenten von F₂','F₂x = 4500 N · cos 70° ≈ 1539 N;  F₂y = 4500 N · sin 70° ≈ 4229 N'],
  ['Summe der Komponenten','F_Rx = 3830 N + 1539 N ≈ 5369 N;  F_Ry = 3214 N + 4229 N ≈ 7443 N'],
  ['Betrag','F_R = √(5369² + 7443²) N ≈ 9177 N'],
  ['Richtung','α_R1 = arctan(7443 / 5369) ≈ 54,2°. Probe: sin α_R = 7443 / 9177 ≈ 0,811 ✓, passt. (Die Zweitlösung 234,2° wäre falsch, denn beide Komponenten sind positiv.)']],
  'F_R ≈ 9177 N unter α_R ≈ 54,2°. Soll der Baum im Gleichgewicht bleiben, muss eine dritte Kraft genau so groß, aber entgegengesetzt wirken.'),
 LC('Beide Komponenten der Resultierenden sind positiv, und arctan(F_Ry/F_Rx) ergibt 54,2°. Welcher Winkel ist richtig?',['54,2°','234,2°','−54,2°','125,8°'],0,'Beide Komponenten positiv heißt erster Quadrant, also 54,2°. Die Zweitlösung α_R1 + 180° = 234,2° läge im dritten Quadranten.'),
 LT('Gleichgewicht im zentralen ebenen Kraftsystem',[
  'Ein zentrales ebenes Kraftsystem ist im Gleichgewicht, wenn der Vektor der Resultierenden der **Nullvektor** ist. In Komponenten: Die Summe aller Kräfte in x-Richtung ist null **und** die Summe aller Kräfte in y-Richtung ist null.',
  'Zeichnerisch ist im Gleichgewicht das **Kräftepolygon (Krafteck) geschlossen**.'],
  'Zwei Gleichungen, also höchstens zwei Unbekannte.',
  ['ΣF_ix = 0  (→)','ΣF_iy = 0  (↑)']),
 LT('Das Lösungsschema für Aufgaben',[
  '**1.** Lageplan skizzieren (Reibungsfreie Rollen und ähnliche Idealisierungen vermerken).',
  '**2.** Freikörperbild zeichnen, mit Koordinatensystem, Kräften, Winkeln und Bezeichnungen.',
  '**3.** Gleichgewichtsbedingungen ΣF_x = 0 und ΣF_y = 0 aufstellen. Zähle: Anzahl der Unbekannten ≤ Anzahl der Gleichungen?',
  '**4.** Komponenten mit Trigonometrie ausdrücken.',
  '**5.** Einsetzen und das Gleichungssystem lösen.',
  '**6.** Ergebnis prüfen: Ein negatives Ergebnis bedeutet, dass die Kraft **entgegen der angenommenen Richtung** wirkt. Bei einem Stab heißt das: Zug (+) oder Druck (−).'],
  'Erst zählen (Unbekannte ≤ Gleichungen), dann rechnen.'),
 LB('Beispiel: Stabkräfte bei einer hängenden Last','Last F_G = 500 N (m ≈ 50 kg). Stab 1 unter 60° und Stab 2 unter 40° zur Horizontalen, beide ziehen schräg nach oben, Stab 1 nach links, Stab 2 nach rechts.','Stabkräfte F_S1 und F_S2',[
  ['Gleichgewichtsbedingungen','(1) ΣF_x = 0:  −F_S1 · cos 60° + F_S2 · cos 40° = 0\n(2) ΣF_y = 0:  F_S1 · sin 60° + F_S2 · sin 40° − 500 N = 0'],
  ['Zählen','Zwei Unbekannte (F_S1, F_S2), zwei Gleichungen: lösbar.'],
  ['Aus (1) F_S2 ausdrücken','F_S2 = F_S1 · cos 60° / cos 40° ≈ 0,653 · F_S1'],
  ['In (2) einsetzen','F_S1 · (sin 60° + 0,653 · sin 40°) = 500 N  →  F_S1 · 1,286 = 500 N'],
  ['Auflösen','F_S1 ≈ 389,0 N  und  F_S2 ≈ 0,653 · 389,0 N ≈ 253,9 N'],
  ['Probe','x: 389,0 · cos 60° = 194,5 N und 253,9 · cos 40° = 194,5 N ✓.  y: 336,9 N + 163,2 N ≈ 500 N ✓']],
  'F_S1 ≈ 389 N und F_S2 ≈ 254 N, beide positiv, also **Zugstäbe** (wie angenommen).'),
 LC('Beim Lösen einer Aufgabe ergibt sich für eine Stabkraft ein negativer Wert. Was bedeutet das?',['Die Rechnung ist falsch','Die Kraft wirkt entgegen der angenommenen Richtung (beim Stab: Druck)','Der Stab ist ein Nullstab','Der Stab reißt'],1,'Das Vorzeichen zeigt nur, dass die Richtung anders ist als angenommen. Bei einem Stab bedeutet ein angenommener Zug mit negativem Ergebnis: Druck.'),
 LT('Einheitsvektor und Kräfte im Raum',[
  'Ein **Einheitsvektor** e hat den Betrag 1. Jeder Vektor ist Betrag mal Einheitsvektor: F = F · e. In der Ebene gilt e = (cos α ; sin α). Die Schreibweise mit Einheitsvektoren drückt dasselbe aus wie die Komponentenschreibweise.',
  'Im **Raum** kommt ein zweiter Winkel β hinzu. α liegt in der xy-Ebene (gegen den Uhrzeigersinn von der positiven x-Richtung zur Projektion der Kraft). β wird von der positiven z-Richtung zur Kraft gemessen. Liegt die Wirklinie durch zwei Punkte A und B, bekommst du den Einheitsvektor direkt aus den Koordinaten.'],
  'Das Gleichgewicht im Raum hat drei Gleichungen: ΣF_x = ΣF_y = ΣF_z = 0.',
  ['F_x = F · cos α · sin β','F_y = F · sin α · sin β','F_z = F · cos β','e_AB = (1 / L_AB) · (x_B − x_A ; y_B − y_A ; z_B − z_A)','L_AB = √((x_B − x_A)² + (y_B − y_A)² + (z_B − z_A)²)'])
]},

{id:'k04',titel:'04 Allgemeines ebenes Kraftsystem',kurz:'Kräftepaar, Moment, Hebelgesetz, Momentengleichgewicht',min:40,quelle:'Skript 04 und Vorlesungsbeispiele (Beamer, Traktor)',steps:[
 LT('Wenn sich die Wirklinien nicht in einem Punkt schneiden',[
  'Ein **allgemeines ebenes Kraftsystem** besteht aus mindestens drei Kräften, die alle in einer Ebene liegen, und deren Wirklinien **keinen gemeinsamen Schnittpunkt** haben.',
  'Sind Wirklinien und Kräfteverhältnisse günstig, kann die Resultierende schrittweise nach dem Parallelogrammsatz ermittelt werden (erst R₁₂, dann R₁₂ mit F₃). Bei ungünstigen Verhältnissen entstehen **parallele Wirklinien**, und der Parallelogrammsatz funktioniert nicht. Es gilt weiterhin F_R = ΣF_i, aber das liefert nicht die **Wirklinie** von F_R.'],
  'Der Vektor F_R ist immer die Summe. Offen ist nur, wo die Wirklinie liegt.'),
 LT('Parallele Kräfte zusammenfassen: das Hebelgesetz',[
  'Beispiel Waage: Der Lagerpunkt muss auf der Wirklinie der Resultierenden der beiden Gewichtskräfte liegen. Aber F₁ und F₂ sind parallel.',
  '**Trick**: Du fügst eine Gleichgewichtsgruppe hinzu, zwei gleich große, entgegengesetzte Kräfte auf einer gemeinsamen Wirklinie senkrecht zu F₁ und F₂, mit beliebigem Betrag. Danach kannst du jeweils zwei Kräfte mit dem Parallelogrammsatz zusammenfassen. Die Lagerkraft muss den gleichen Betrag und die gleiche Wirklinie haben wie R₁₂.',
  'Aus den ähnlichen Dreiecken (tan α₁ = a₁/h = F₂/F₁ und tan α₂ = a₂/h) folgt das **Hebelgesetz des Archimedes**.'],
  'Kraft mal Hebelarm links = Kraft mal Hebelarm rechts.',
  ['F₁ · a₁ = F₂ · a₂']),
 LC('An einer Waage hängt links F₁ = 60 N im Abstand a₁ = 0,5 m vom Lager. Rechts hängt F₂ = 40 N. In welchem Abstand a₂ ist die Waage im Gleichgewicht?',['0,33 m','0,5 m','0,75 m','1,2 m'],2,'F₁ · a₁ = F₂ · a₂ → 60 N · 0,5 m = 40 N · a₂ → a₂ = 30 Nm / 40 N = 0,75 m.'),
 LT('Kräftepaar und Moment',[
  'Zwei gleich große, entgegengesetzte Kräfte auf parallelen Wirklinien sind ein **Sonderfall**, der sich nicht weiter zusammenfassen lässt. Ein **Kräftepaar** ist ein Paar paralleler Kräfte, die einander entgegengerichtet und gleich groß sind. Es kann nicht durch eine resultierende Kraft ersetzt werden und kann einen Körper nicht verschieben, aber drehen. Beispiele: Lenkrad, Radkreuz.',
  'Das **Moment** M ist ein Maß für die Wirkung des Kräftepaars. Der Abstand d der Wirklinien wird **senkrecht** zu diesen gemessen. Der Drehsinn folgt der rechten-Hand-Regel: gegen den Uhrzeigersinn **positiv**, mit dem Uhrzeigersinn **negativ**.'],
  'Moment = Kraft mal senkrechter Abstand. Einheit Nm.',
  ['M = F · d    [M] = 1 Nm']),
 LC('Ein Kräftepaar besteht aus zwei Kräften von je 20 N im Abstand d = 0,3 m. Wie groß ist das Moment?',['6 Nm','60 Nm','0,015 Nm','40 Nm'],0,'M = F · d = 20 N · 0,3 m = 6 Nm. Das Kräftepaar besteht aus zwei Kräften, aber das Moment wird mit F (nicht 2F) berechnet.'),
 LT('Das Moment ist ein freier Vektor',[
  'Das Moment ist (wie die Kraft) ein Vektor und steht senkrecht auf der vom Kräftepaar aufgespannten Ebene. Am starren Körper ist es ein **freier Vektor**: Anders als der Kraftvektor darf es auch **senkrecht zu seiner Wirklinie** verschoben werden, ohne dass sich die Wirkung ändert.',
  'Ein Kräftepaar kann auf seiner Wirklinie beliebig verschoben werden, die Richtung seiner Wirklinien ist beliebig, und es kann in seiner Ebene beliebig verschoben werden (kein bestimmter Angriffsort). Das Moment bleibt gleich, solange F · d gleich bleibt: M = F₁d₁ = F₂d₂.',
  'Momente in einer Ebene fasst du durch **Addition** zusammen, unter Beachtung der Drehsinne.'],
  'Moment frei verschiebbar, Kraft nur längs der Wirklinie.',
  ['M_ges = M₁ + … + M_n']),
 LT('Das Versetzungsmoment',[
  'Willst du eine Kraft F **parallel** um die Strecke d verschieben, fügst du wieder eine Gleichgewichtsgruppe hinzu. Danach wirkt auf den Körper die verschobene Kraft **und** ein Kräftepaar. Parallelverschiebung einer Kraft erzeugt ein **Versetzungsmoment** M = F · d.',
  'Die Wirkung einer Kraft mit Angriffspunkt P auf den starren Körper setzt sich also zusammen aus (1) der Kraft F, wenn sie an einem beliebigen Punkt A wirkt, und (2) dem Versetzungsmoment M = F · d, das beim Verschieben von P nach A entsteht.'],
  'Kraft parallel verschieben = Kraft + Versetzungsmoment.',
  ['M = F · d']),
 LT('Allgemeines Kraftsystem: zwei Schritte und Gleichgewicht',[
  'Die Wirkung eines allgemeinen ebenen Kraftsystems auf einen starren Körper bestimmst du in **zwei Schritten**. (1) Du tust so, als wären alle Kräfte in einen Punkt A verschoben (zentrales Kräftesystem), und bildest die Kräftesumme F_R = ΣF_i. (2) Du addierst die Versetzungsmomente. Dabei ist (x_i ; y_i) der Angriffspunkt der Kraft F_i bezogen auf A.',
  'Im **Gleichgewicht** sind die resultierende Kraft F_R und das resultierende Moment M_R gleich null. Es gibt drei Gleichungen (mit A als Bezugspunkt für das Momentengleichgewicht).',
  'Es gibt zwar unendlich viele Gleichgewichtsbedingungen, aber nur **drei sind linear unabhängig**. Deshalb kannst du **höchstens drei Unbekannte** berechnen. Davon dürfen höchstens zwei Kräftegleichungen sein, aber beliebig viele Momentengleichungen. Bei drei Momentengleichungen dürfen die drei Bezugspunkte nicht auf einer Geraden liegen. Weitere Momentengleichungen dienen der Kontrolle.'],
  'Höchstens drei unabhängige Gleichungen, also höchstens drei Unbekannte.',
  ['M_iA = x_i · F_iy − y_i · F_ix','M_RA = ΣM_iA','ΣF_ix = 0  (→)','ΣF_iy = 0  (↑)','ΣM_iA = 0  (↺)']),
 LC('Wie viele Unbekannte kannst du aus den Gleichgewichtsbedingungen eines allgemeinen ebenen Kraftsystems höchstens berechnen?',['Zwei','Drei','Vier','Beliebig viele'],1,'Nur drei Gleichgewichtsbedingungen sind linear unabhängig. Weitere Momentengleichungen sind nur eine Kontrolle.'),
 LB('Beispiel: Ist der Körper im Gleichgewicht? (Beamer, Momentenbilanz um A)','Drei Kräfte wirken am Körper mit dem Festlager A: F₁ = 6 N im Abstand 0,15 m (Drehsinn ↺, positiv), F₃ = 6 N im Abstand 0,05 m (↻, negativ), F₂ = 3 N im Abstand 0,2 m (↻, negativ).','Dreht sich der Körper? (ΣM_A)',[
  ['Moment einer Kraft','Moment = Kraft (N) · Weg (m). Der Weg ist der **senkrechte Abstand** und muss einen 90°-Winkel zur Wirklinie enthalten.'],
  ['Momentengleichgewicht um A','ΣM_A = 6 N · 0,15 m − 6 N · 0,05 m − 3 N · 0,2 m'],
  ['Ausrechnen','ΣM_A = 0,9 Nm − 0,3 Nm − 0,6 Nm = 0']],
  'ΣM_A = 0: Der Körper dreht sich nicht. Zum vollständigen Gleichgewicht gehören noch ΣF_x = 0 und ΣF_y = 0. Das Festlager A wird dabei durch seine Kräfte F_Ax und F_Ay ersetzt, die in der Momentengleichung um A kein Moment liefern.'),
 LT('Den Bezugspunkt geschickt wählen',[
  'Du kannst **jeden beliebigen Punkt** als Bezugspunkt für das Momentengleichgewicht wählen. Das Ergebnis bleibt gleich. Das liegt daran, dass das Moment ein freier Vektor ist.',
  'Geschickt ist ein Punkt, **durch den unbekannte Kräfte laufen**: Deren Abstand ist 0, ihr Moment ist 0, und sie fallen aus der Gleichung heraus. So bekommst du oft eine Gleichung mit nur einer Unbekannten.',
  'Im **zentralen** Kraftsystem gibt es keine Momentenwirkung: Weil alle Kräfte im selben Punkt angreifen, kannst du für alle d = 0 wählen, und damit ist M = F · d = 0.'],
  'Bezugspunkt dort, wo viele unbekannte Kräfte angreifen.'),
