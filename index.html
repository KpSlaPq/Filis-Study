 LB('Beispiel: Kippbedingung beim Traktor mit Grubbermesser','Die Gewichtskraft F_G wirkt im Abstand b vom hinteren Lager B, die vordere Lagerkraft F_NA im Abstand a + b, und die waagerechte Last F_last greift in der Höhe h an. Zahlenwerte als Übung: F_G = 20 000 N, b = 2 m, h = 0,2 m.','Größte Last F_last, bei der der Traktor vorne gerade noch nicht abhebt (F_NA = 0)',[

{id:'k05',titel:'05 Lagerungen',kurz:'Freiheitsgrade, Wertigkeit, Fest- und Loslager, Einspannung',min:30,quelle:'Skript 05, Prof. Engel und Prof. Laveuve',steps:[
 LT('Freiheitsgrade',[
  'Jede Bewegung eines Starrkörpers in der **Ebene** ist eine Kombination aus **zwei Verschiebungen** (Translationen) und **einer Drehung** (Rotation). Im **Raum** sind es Verschiebungen entlang dreier orthogonaler Achsen und Drehungen um diese drei Achsen.',
  'Ohne Lagerung kann sich der Starrkörper beliebig verschieben und drehen. Alle materiellen Punkte bewegen sich gleich. Man sagt: Punkte ohne Lagerbedingung haben in der Ebene **drei Freiheitsgrade**. Lagerbedingungen schränken die Bewegung ein, und die Zahl der Freiheitsgrade sinkt.'],
  'Ebene: 3 Freiheitsgrade. Raum: 6.'),
 LT('Wertigkeit von Lagern',[
  'Reale Systeme hängen nicht frei in der Luft, Lagerungen halten Brücken, Verkehrsschilder und Maschinenteile. **Statik funktioniert nicht ohne Lagerung.**',
  'Die **Wertigkeit W** eines Lagers gibt an, wie viele Freiheitsgrade es am jeweiligen Punkt wegnimmt. Einwertig: ein Freiheitsgrad weniger (zwei bleiben übrig). Zweiwertig: zwei weniger (einer bleibt). Dreiwertig: drei weniger, es bleibt in der Ebene keine Beweglichkeit übrig.',
  '**Auflager** verbinden Starrkörper mit der Umgebung. **Zwischenlager** verbinden Starrkörper untereinander. Beide halten das System in definierten Positionen und übertragen Kräfte und/oder Momente. Die dabei entstehenden Reaktionskräfte und -momente stellen sich so ein, dass das System im statischen Gleichgewicht ist.'],
  'Wertigkeit = Zahl der weggenommenen Freiheitsgrade.'),
 LL('Die gebräuchlichen Lager im Überblick',['Lager','Wertigkeit W','Lagerreaktionen'],[
  ['Loslager (Auflager)','1','eine Kraft senkrecht zur Auflagefläche'],
  ['Festlager (Auflager)','2','zwei Kraftkomponenten, z. B. F_Ax und F_Ay, kein Moment'],
  ['(feste) Einspannung (Auflager)','3','zwei Kraftkomponenten und ein Moment'],
  ['Längsführung (Auflager oder Zwischenlager)','2','z. B. Kugelwagen auf einer Führungsschiene: erlaubt die Verschiebung längs der Schiene'],
  ['Winkelführung (Auflager oder Zwischenlager)','2','siehe Tabelle im Skript (Folien 19 und 20)'],
  ['Gelenk (Zwischenlager)','2','Längs- und Querkraft, **kein Moment**']],
  ['Die Wertigkeit richtet sich nach den verhinderten Bewegungen: Das Loslager verhindert nur eine, das Festlager zwei (die Drehung bleibt möglich), die Einspannung alle drei.']),
 LC('Welche Lagerreaktionen hat ein Festlager?',['Nur eine Kraft senkrecht zur Fläche','Zwei Kraftkomponenten, kein Moment','Zwei Kraftkomponenten und ein Moment','Nur ein Moment'],1,'Das Festlager ist zweiwertig: Es verhindert zwei Verschiebungen, die Drehung bleibt möglich. Deshalb gibt es kein Moment.'),
 LT('Warum entstehen Lagerreaktionen? Das Rollenlager der Brücke',[
  'Beispiel Rollenlager für Brücken: Bei der **horizontalen Kraft** weicht das Lager aus, bis die Kraft null ist, es gibt keine Lagerreaktion. Beim **Moment** erlaubt es die Drehung um die Lagerwalze, bis das Moment null ist, ebenfalls keine Reaktion. Gegen die **vertikale Kraft** verhindert es das Ausweichen nach unten, hier entsteht eine Reaktionskraft. Es nimmt nur senkrechte Kräfte auf und ist **einwertig**.',
  'Daraus folgt die wichtigste Regel: Die eingeschränkte Bewegungsmöglichkeit entspricht der übertragbaren Lagerreaktion. **Lagerreaktionen entstehen nur in den Richtungen, in denen das Lager die Bewegung verhindert.**'],
  'Bewegung verhindert → Reaktion. Bewegung möglich → keine Reaktion.'),
 LC('Ein Loslager erlaubt das Ausweichen in horizontaler Richtung. Welche Folge hat das?',['Es entsteht eine große horizontale Reaktion','In horizontaler Richtung entsteht keine Lagerreaktion','Das Lager ist dreiwertig','Das Lager kann kein Gewicht tragen'],1,'Wo das Lager die Bewegung erlaubt, entsteht keine Reaktion. Die Kraft weicht aus, bis sie null ist.'),
 LT('Alternative Bauformen und Freischneiden an Lagern',[
  '**Loslager** (einwertig, verhindert nur eine Bewegung) lässt sich ersetzen durch eine rechtwinklige Stabstütze (Pendelstütze), ein rechtwinkliges Seil, reibungsfreie Auflager oder eine reibungsfreie Gleithülse. Die Kraftrichtung ist immer klar.',
  '**Festlager** (zweiwertig) hat zunächst eine unbekannte Kraftrichtung. Man teilt sie in zwei beliebige, zweckmäßig zueinander senkrechte Richtungen auf. Ein Festlager kann zwei Pendelstützen ersetzen, und umgekehrt: Zwei nicht zueinander senkrechte Pendelstützen ersetzen ein Festlager.',

  'Nach der Rechnung prüfst du die **reale Lagerung**: Reicht die Tragfähigkeit der Bauteile für die Lagerreaktionen? Sind die entstehenden Bewegungen mit der Funktion des Lagers vereinbar? Beispiel: Ein Pendelrollenlager lässt nur eine kleine Winkelbewegung zu (z. B. ± 2°). Die berechnete Auslenkung (TM2) darf nicht größer sein.'],
  'Idealisieren zum Rechnen, danach die reale Lagerung prüfen.'),
 LC('Was kann ein Gelenk nicht übertragen?',['Längskräfte','Querkräfte','Momente','Gar nichts, es ist dreiwertig'],2,'Das Gelenk ist zweiwertig. Es überträgt Längs- und Querkraft, aber kein Moment, denn es lässt die Drehung zu.')

{id:'k06',titel:'06 Mehrkörpersysteme',kurz:'Zwischenlager, Freischneiden der Einzelkörper',min:15,quelle:'Wiederholungsfragen WiSe19 (das Skript zu Kapitel 06 liegt nicht vor)',hinweis:'Zu Kapitel 06 gibt es in deinen PDFs nur die Wiederholungsfragen. Die Erklärungen hier folgen diesen Fragen und den Begriffen aus Kapitel 05.',steps:[

  'Du kannst also sowohl das **ganze System** als auch **jeden einzelnen Starrkörper** freischneiden und jeweils Gleichgewicht ansetzen. An den Schnittufern eines Zwischenlagers wirken nach dem **Wechselwirkungsprinzip** gleich große, entgegengerichtete Kräfte. Sind alle einzelnen Starrkörper im Gleichgewicht, ist auch das Mehrkörpersystem im Gleichgewicht.',
  'Alle Unbekannten sind lösbar, wenn die Anzahl der **unabhängigen Gleichungen mindestens so groß** ist wie die Anzahl der Unbekannten. Genau gleich viele nennt man statisch bestimmt (Kapitel 07).'],

 LC('Ein Mehrkörpersystem hat vier unbekannte Auflagerreaktionen, aber nur drei Gleichungen. Wie gehst du weiter vor?',['Es ist nicht berechenbar','Eine Unbekannte als Variable stehen lassen','Du betrachtest die einzelnen Starrkörper (freischneiden)','Du tauschst die Auflager aus'],2,'Jeder einzeln freigeschnittene Starrkörper liefert drei weitere Gleichgewichtsbedingungen.'),
 LC('Wie verhalten sich die Kräfte an den beiden Schnittufern eines Zwischenlagers?',['Gleich groß und gleich orientiert','Gleich groß, aber entgegengerichtet','Unterschiedlich groß','Sie heben sich nie auf'],1,'Wechselwirkungsprinzip: gleich groß und entgegengerichtet, am jeweils anderen Körper.')

/* ---------- Daten ---------- */
const KEY='atelier-bordeaux-v1';
const HUES=['#d9667f','#d9a85e','#a77bc4','#74b394','#d28a64','#7b95d0'];
const HUENAMES=['Rosé','Champagner','Pflaume','Salbei','Kupfer','Taubenblau'];

function newCard(sid,q,a,w,t){return {id:uid(),sid:sid,q:q,a:a,w:w||'',t:t||'',seen:0,due:dnum(),ivl:0,ease:2.4,reps:0,lapses:0,created:Date.now()+seq/1000}}
function defaults(){return {v:1,name:'',theme:'',subjects:[],cards:[],log:{},cal:{g:[0,0],a:[0,0],c:[0,0]},set:{newPerDay:8,mix:true,size:20,learnFirst:true},plans:[],nt:{d:'',n:0},qz:{r:{}}}}
function seed(){
  const s=defaults();
  s.subjects.push({id:'tm1',name:'Technische Mechanik 1',exam:'',hue:HUES[0]});
  SEED.forEach(r=>s.cards.push(newCard('tm1',r[0],r[1],r[2],r[3])));
  return s;
}
function merge(o){const d=defaults();return Object.assign(d,o,{set:Object.assign(d.set,o.set||{}),cal:Object.assign(d.cal,o.cal||{}),qz:Object.assign(d.qz,o.qz||{})})}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.cards)&&Array.isArray(o.subjects))return merge(o)}}catch(e){}
  return null;
}
let S=load()||seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const byId=id=>S.cards.find(c=>c.id===id);
const subj=id=>S.subjects.find(s=>s.id===id);
const topicsOf=sid=>Array.from(new Set(S.cards.filter(c=>c.sid===sid).map(c=>c.t).filter(Boolean)));
function dayRec(n){const k=dstr(n==null?dnum():n);return S.log[k]||(S.log[k]={n:0,ok:0,min:0,blank:0})}
function peek(n){return S.log[dstr(n)]||{n:0,ok:0,min:0,blank:0}}
const active=r=>r.n>0||r.min>0||r.blank>0;
function streak(){let n=dnum(),c=0;if(!active(peek(n)))n--;while(active(peek(n))){c++;n--}return c}
function ntCount(){const t=dstr(dnum());if(S.nt.d!==t)S.nt={d:t,n:0};return S.nt.n}

function stats(sid){
  const t=dnum(),cs=sid?S.cards.filter(c=>c.sid===sid):S.cards;
  return {total:cs.length,fresh:cs.filter(c=>!c.seen).length,learn:cs.filter(c=>c.seen&&c.ivl<21).length,master:cs.filter(c=>c.seen&&c.ivl>=21).length,due:cs.filter(c=>c.seen&&c.due<=t).length};
}
function plan(){
  const t=dnum();
  const due=S.cards.filter(c=>c.seen&&c.due<=t).length;
  const fresh=Math.min(S.cards.filter(c=>!c.seen).length,Math.max(0,S.set.newPerDay-ntCount()));
  return {due:due,fresh:fresh,total:due+fresh};
}
const examDay=s=>pdate(s&&s.exam);
function daysTo(s){const e=examDay(s);return e==null?null:e-dnum()}
function examLabel(s){const d=daysTo(s);if(d==null)return '';if(d<0)return 'Klausur vorbei';if(d===0)return 'Klausur heute';if(d===1)return 'Klausur morgen';return 'Klausur in '+d+' Tagen'}

/* ---------- Terminplanung (verteilt, mit Obergrenze durch das Klausurdatum) ---------- */
function examCap(sid){
  const s=subj(sid),d=daysTo(s);
  if(d==null||d<=0)return null;
  const f=d<=7?.3:d<=30?.22:d<=90?.14:.08;   // Cepeda et al. (2008): Anteil an der Restzeit sinkt, je weiter die Prüfung entfernt ist
  return Math.max(1,Math.round(d*f));
}
function gradeCard(c,g){
  const today=dnum();c.seen=1;
  if(g===0){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=today;return}
  let ivl;
  if(c.reps===0)ivl=[0,1,2,4][g];
  else if(c.reps===1)ivl=[0,2,4,7][g];
  else{ivl=Math.round(c.ivl*[0,1.2,c.ease,c.ease*1.3][g]);ivl=Math.max(ivl,c.ivl+1)}
  if(g===1)c.ease=Math.max(1.3,c.ease-.15);
  if(g===3)c.ease=Math.min(3,c.ease+.1);
  const cap=examCap(c.sid);
  if(cap)ivl=Math.min(ivl,cap);
  ivl=Math.max(1,Math.min(180,ivl));
  c.reps++;c.ivl=ivl;c.due=today+ivl;
}
function previewIvl(c,g){if(g===0)return 'heute';const t=Object.assign({},c);gradeCard(t,g);return fmtIvl(t.ivl)}
function fmtIvl(d){if(d<1)return 'heute';if(d===1)return '1 Tag';if(d<30)return d+' Tage';const m=Math.round(d/30);return m+(m===1?' Monat':' Monate')}

function interleave(list){
  const g={};list.forEach(c=>{const k=c.sid+'|'+(c.t||'');(g[k]=g[k]||[]).push(c)});
  const ks=shuf(Object.keys(g)),out=[];let more=true;
  while(more){more=false;ks.forEach(k=>{if(g[k].length){out.push(g[k].shift());more=true}})}
  return out;
}
function buildQueue(cfg){
  const t=dnum(),pool=S.cards.filter(c=>!cfg.sid||c.sid===cfg.sid);let list;
  if(cfg.mode==='sim'){const seen=pool.filter(c=>c.seen);list=shuf(seen.length>=5?seen:pool)}
  else{
    const due=pool.filter(c=>c.seen&&c.due<=t).sort((a,b)=>a.due-b.due);
    const allow=Math.max(0,S.set.newPerDay-ntCount());
    const fresh=pool.filter(c=>!c.seen).sort((a,b)=>a.created-b.created).slice(0,allow);
    list=due.concat(fresh);
  }
  if(S.set.mix)list=interleave(list);
  if(cfg.size)list=list.slice(0,cfg.size);
  return list.map(c=>c.id);
}

function applyTheme(){
  const r=document.documentElement;if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  const dark=S.theme?S.theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML=(dark?ico('sun',18)+' Helles Design':ico('moon',18)+' Dunkles Design');
}

/* ---------- Komponenten ---------- */
function ring(pct,size,label,sub){
  const r=size/2-8,c=2*Math.PI*r,h=size/2;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring-bg" cx="${h}" cy="${h}" r="${r}"/><circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-Math.max(0,Math.min(1,pct)))).toFixed(1)}" transform="rotate(-90 ${h} ${h})"/></svg><div class="ring-in"><b class="tnum">${label}</b>${sub?'<small>'+sub+'</small>':''}</div></div>`;
}
function stackBar(st){
  const t=st.total||1;
  return `<div class="bar" role="img" aria-label="${st.master} gefestigt, ${st.learn} in Arbeit, ${st.fresh} neu"><i class="b-m" style="width:${st.master/t*100}%"></i><i class="b-l" style="width:${st.learn/t*100}%"></i></div>`;
}
function forecast(){
  const t=dnum(),vals=[];
  for(let k=0;k<7;k++){vals.push(S.cards.filter(c=>c.seen&&(k===0?c.due<=t:c.due===t+k)).length)}
  if(!vals.some(v=>v>0))return '<p class="muted">Noch nichts geplant. Nach deiner ersten Einheit siehst du hier, an welchen Tagen Wiederholungen fällig werden.</p>';
  const mx=Math.max(4,Math.max.apply(null,vals)),W=300,H=96,bw=30,gap=(W-7*bw)/6;
  let out=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Geplante Wiederholungen der nächsten 7 Tage: ${vals.join(', ')}">`;
  vals.forEach((v,k)=>{
    const h=Math.max(3,v/mx*(H-18)),x=k*(bw+gap),y=H-h;
    const lab=k===0?'heute':new Date((t+k)*DAY).toLocaleDateString('de-DE',{weekday:'short',timeZone:'UTC'}).replace('.','');
    out+=`<rect class="${k===0?'fc-today':'fc-bar'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="7"/><text class="fc-txt" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${v}</text><text class="fc-txt" x="${(x+bw/2).toFixed(1)}" y="${H+16}" text-anchor="middle">${lab}</text>`;
  });
  return out+'</svg>';
}
function subjDot(s){return `<span class="dot" style="background:${s?s.hue:'var(--gold)'}"></span>`}

const PROMPT='Wandle das angehängte Material in Karteikarten zum Lernen um, genau im folgenden Format.\n\nRegeln:\n- Verwende NUR Informationen, die im Material stehen. Was nicht im Material steht, bekommt keine Karte, und du erfindest nichts.\n- Eine Karte = eine Idee. Stelle Fragen, die Erinnern erfordern („Was ist …“, „Warum …“, „Was ist der Unterschied zwischen …“, „Wann verwendet man …“), niemals Ja-Nein-Fragen.\n- Kurze Antwort von 1 bis 3 Sätzen mit den Fachbegriffen aus dem Material, so wie das Material sie schreibt.\n- Bei „Warum“ schreibst du einen Satz mit dem Grund oder dem Zusammenhang mit einem anderen Begriff aus dem Material.\n- Bei „Thema“ nimmst du den Kapitel- oder Abschnittstitel (2 bis 4 Wörter).\n- Gehe das Material der Reihe nach durch, jeweils 20 bis 40 Karten, und sage Bescheid, wenn noch Inhalt fehlt.\n- Antworte nur mit den Karten, eine Zeile pro Karte, ohne Nummerierung und ohne zusätzlichen Text, in diesem Format:\nFrage :: Antwort :: Warum :: Thema';

    const c=S.cal.c;if(c[1]>=8&&c[0]/c[1]<.8)cal+=`<p class="muted small">Wenn du „Sicher“ wählst, liegst du nur in ${Math.round(c[0]/c[1]*100)} % der Fälle richtig. Du überschätzt dich: Teste dich öfter, bevor du ein Thema abhakst.</p>`;

  h+=`<section class="grid g2"><div class="card"><div class="sec-h"><h2>Klausuren</h2></div>${exh}</div><div class="card stack"><div class="sec-h" style="margin:0"><h2>Wie gut schätzt du dich ein?</h2></div><p class="muted small">Wie oft du richtig lagst (Gut oder Leicht), getrennt nach deiner Sicherheit vor der Antwort.</p>${cal}</div></section>`;
  const qr=S.qz.r,qd=Object.keys(qr).length,qk=Object.keys(qr).filter(k=>qr[k]===1).length;

   ${n?'':`<p class="muted small">${cfg.mode==='day'?'Heute ist in dieser Auswahl nichts fällig und nichts neu. Probiere die Klausursimulation.':'In dieser Auswahl gibt es keine Karten.'}</p>`}</section>`;

function cur(){const s=ui.ses;return s&&byId(s.q[s.i])}
function sesView(){
  const s=ui.ses;
  if(s.i>=s.q.length)return sesDone();
  const c=cur();if(!c){s.i++;return sesView()}
  const sub=subj(c.sid),learn=!c.seen&&s.mode==='day'&&S.set.learnFirst!==false&&!s.lrn[c.id],fresh=!c.seen&&!s.lrn[c.id]&&!learn,pct=Math.round(s.i/s.q.length*100);
  let h=`<div class="ses-top"><button class="btn quiet sm" data-act="endSes">${ico('x',18)} Beenden</button><div class="ses-prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i class="b-m" style="width:${pct}%"></i></div><span class="tnum">${s.i+1} von ${s.q.length}</span></div></div>`;
  h+=`<section class="card study rise" aria-live="polite"><div class="row">${sub?`<span class="pill">${subjDot(sub)} ${esc(sub.name)}</span>`:''}${c.t?`<span class="pill">${esc(c.t)}</span>`:''}${learn?`<span class="pill gold">Neu · erst lernen</span>`:''}${fresh?`<span class="pill gold">Neu · erst raten</span>`:''}${s.lrn[c.id]?`<span class="pill gold">Jetzt aus dem Kopf</span>`:''}${s.mode==='sim'?'<span class="pill rose">Simulation</span>':''}</div>
   <div class="stack" style="gap:10px"><p class="eyebrow">Frage</p><p class="qtext">${esc(c.q)}</p></div>`;
  if(learn){
    h=h.replace('<p class="eyebrow">Frage</p>','<p class="eyebrow">Das lernst du jetzt</p>');
    h+=`<div class="stack rise" style="gap:16px"><div><p class="eyebrow" style="margin-bottom:8px">Antwort</p><p class="atext">${esc(c.a)}</p></div>${c.w?`<p class="why"><b>Warum:</b> ${esc(c.w)}</p>`:''}<p class="muted small">Lies die Antwort in Ruhe und erkläre sie dir in eigenen Worten. Gleich kommen ein paar andere Karten, danach fragt dich die App diese Karte aus dem Kopf ab.</p><div class="row"><button class="btn primary" data-act="lrnDone">Verstanden, weiter ${ico('chev',16)}</button><span class="muted small"><kbd>Enter</kbd> oder <kbd>Leertaste</kbd></span></div></div>`;
    return h+'</section>';
  }
  if(s.stage==='q'){
    h+=`<label class="f">${fresh?'Diese Karte ist neu für dich. Rate einfach: Auch ein falscher Tipp hilft, dir die Antwort danach besser zu merken.':'Schreibe (oder sprich laut), was du weißt'}<textarea class="in" id="attempt" data-in="attempt" placeholder="Dein Versuch, ohne etwas nachzuschlagen …">${esc(s.attempt||'')}</textarea></label>`;
    if(fresh)h+=`<div class="row"><button class="btn primary" data-act="reveal" data-v="">Antwort zeigen</button><span class="muted small"><kbd>Enter</kbd> oder <kbd>Leertaste</kbd></span></div>`;
    else h+=`<div class="stack" style="gap:10px"><span class="muted small" style="font-weight:600">Wie sicher bist du bei deiner Antwort? <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span><div class="conf"><button class="btn ghost" data-act="reveal" data-v="g">Geraten<small>ich weiß es kaum</small></button><button class="btn ghost" data-act="reveal" data-v="a">Eher ja<small>ich weiß einen Teil</small></button><button class="btn ghost" data-act="reveal" data-v="c">Sicher<small>würde ich so abgeben</small></button></div><button class="btn quiet sm" style="align-self:flex-start" data-act="reveal" data-v="">Ohne Einschätzung weiter</button></div>`;
  }else{
    h+=`<div class="stack rise" style="gap:16px">${s.attempt&&s.attempt.trim()?`<div><p class="eyebrow" style="margin-bottom:6px">Dein Versuch</p><div class="attempt">${esc(s.attempt)}</div></div>`:''}<div><p class="eyebrow" style="margin-bottom:8px">Antwort</p><p class="atext">${esc(c.a)}</p></div>${c.w?`<p class="why"><b>Warum:</b> ${esc(c.w)}</p>`:''}</div>
    <div class="stack" style="gap:10px"><span class="muted small" style="font-weight:600">Wie gut hast du es gewusst? Sei ehrlich, davon hängt ab, wann die Karte wiederkommt.</span><div class="grades">
    ${[['Falsch','nicht gewusst'],['Schwer','mit Mühe'],['Gut','gewusst'],['Leicht','sofort gewusst']].map((g,i)=>`<button class="btn gr${i}" data-act="grade" data-v="${i}">${g[0]}<small>${s.mode==='sim'?g[1]:previewIvl(c,i)}</small></button>`).join('')}</div></div>`;
  }
  return h+'</section>';
}
function sesDone(){
  const s=ui.ses,acc=s.first?s.firstOk/s.first:0,miss=s.missed.map(byId).filter(Boolean);
  const cl={g:'Geraten',a:'Eher ja',c:'Sicher'};
  const calRows=['g','a','c'].filter(k=>s.cal[k][1]).map(k=>{const r=s.cal[k],pc=Math.round(r[0]/r[1]*100);return `<div class="cal-row"><span>${cl[k]}</span><div class="bar"><i class="b-m" style="width:${pc}%"></i></div><b class="tnum">${pc} % <span class="muted small">(${r[0]}/${r[1]})</span></b></div>`}).join('');
  const t=dnum(),tmr=S.cards.filter(c=>c.seen&&c.due<=t+1).length;
  let h=`<header class="head"><p class="eyebrow">Einheit abgeschlossen</p><h1 class="display">${s.done?(acc>=.8?'Sehr <em>gut</em>.':acc>=.5?'Gute <em>Arbeit</em>.':'Auch der <em>Fehler</em> lehrt.'):'Einheit <em>beendet</em>.'}</h1></header>`;
  h+=`<section class="card hero-card">${ring(acc,164,Math.round(acc*100)+' %','Treffer im 1. Versuch')}<div class="stack"><p class="lede">${s.done?`Du hast ${s.firstOk} von ${s.first} ${plural(s.first,'Karte','Karten')} im ersten Versuch richtig beantwortet${s.done>s.first?` und insgesamt ${s.done} ${plural(s.done,'Antwort','Antworten')} gegeben, Wiederholungen eingerechnet`:''}.`:'Es wurde keine Karte beantwortet.'}</p><p class="muted">${tmr?`Morgen sind ${tmr} ${plural(tmr,'Wiederholung','Wiederholungen')} geplant.`:'Für morgen ist nichts geplant.'}</p><div class="row"><button class="btn primary" data-act="sesAgain">${ico('reset',18)} Neue Einheit</button><button class="btn ghost" data-act="goHoje">Zurück zum Start</button></div></div></section>`;
  if(calRows)h+=`<section class="card stack"><div class="sec-h" style="margin:0"><h2>Sicherheit in dieser Einheit</h2></div>${calRows}</section>`;
  if(miss.length)h+=`<section class="card"><div class="sec-h"><h2>Vor dem Schlafen noch einmal ansehen</h2><span class="muted small">${miss.length} ${plural(miss.length,'Karte','Karten')}</span></div>${miss.map(c=>`<div class="crow"><div><p class="q">${esc(c.q)}</p><p class="a">${esc(c.a)}</p></div></div>`).join('')}</section>`;
  return h;
}
function startSession(cfg){
  const q=buildQueue(cfg);if(!q.length){toast('In dieser Auswahl gibt es nichts zu wiederholen.');return}
  ui.ses={q:q,i:0,stage:'q',conf:null,attempt:'',mode:cfg.mode,done:0,first:0,firstOk:0,seenIds:{},lrn:{},missed:[],rq:{},cal:{g:[0,0],a:[0,0],c:[0,0]}};
  if(route()!=='wiederholen')go('wiederholen');else render();
}
function doLearn(){const s=ui.ses;if(!s)return;const c=cur();if(!c)return;s.lrn[c.id]=1;s.q.splice(s.i,1);s.q.splice(Math.min(s.q.length,s.i+3),0,c.id);s.stage='q';s.attempt='';render()}
function doReveal(conf){const s=ui.ses;if(!s||s.stage!=='q')return;s.conf=conf||null;s.stage='a';render()}
function doGrade(g){
  const s=ui.ses;if(!s||s.stage!=='a')return;const c=cur();if(!c)return;
  const wasNew=!c.seen,ok=g>=2;
  if(s.mode==='day'){gradeCard(c,g);if(wasNew){ntCount();S.nt.n++}}
  else if(g===0&&c.seen){c.lapses++;c.due=dnum()}
  const r=dayRec();r.n++;if(ok)r.ok++;
  if(s.conf){S.cal[s.conf][1]++;s.cal[s.conf][1]++;if(ok){S.cal[s.conf][0]++;s.cal[s.conf][0]++}}
  s.done++;
  if(!s.seenIds[c.id]){s.seenIds[c.id]=1;s.first++;if(ok)s.firstOk++}
  if(g===0){if(s.missed.indexOf(c.id)<0)s.missed.push(c.id);s.rq[c.id]=(s.rq[c.id]||0)+1;if(s.rq[c.id]<=2){const pos=Math.min(s.q.length,s.i+1+4);s.q.splice(pos,0,c.id)}}
  s.i++;s.stage='q';s.conf=null;s.attempt='';
  save();
  if(s.i>=s.q.length)petals();
  render();
}

  return h;
}
function parseImport(txt){
  const out=[];let skip=0;
  txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;let p;if(l.indexOf('::')>=0)p=l.split('::');else if(l.indexOf('\t')>=0)p=l.split('\t');else{skip++;return}
    p=p.map(x=>x.trim());if(p.length<2||!p[0]||!p[1]){skip++;return}out.push({q:p[0],a:p[1],w:p[2]||'',t:p[3]||''})});
  return {out:out,skip:skip};
}

    h+=stepper(2)+`<section class="grid g2" style="align-items:start"><div class="card stack"><p class="eyebrow">Das hast du geschrieben</p><div class="attempt" style="max-height:420px;overflow:auto">${ex.text.trim()?esc(ex.text):'(leeres Blatt)'}</div></div><div class="card"><p class="eyebrow">Hake ab, was du abgedeckt hast</p><p class="muted small" style="margin:6px 0 4px">Jeder Punkt ist eine Idee aus deinen Karten. Hake nur ab, was du wirklich aufgeschrieben hast.</p>${cards.map(c=>`<label class="check"><input type="checkbox" data-chg="exCheck" data-id="${c.id}" ${ex.checked[c.id]?'checked':''}><span><b>${esc(c.q)}</b><br><span class="muted small">${esc(c.a)}</span></span></label>`).join('')}<div class="row" style="margin-top:14px"><button class="btn primary" data-act="exFinish">Lücken ansehen</button><span class="muted small tnum" id="exCount">${got} von ${cards.length}</span></div></div></section>`;

    h+=gaps.map(c=>`<section class="card stack"><p class="qtext" style="font:600 26px/1.2 var(--serif)">${esc(c.q)}</p><p class="why"><b>Antwort:</b> ${esc(c.a)}${c.w?'<br><b>Warum:</b> '+esc(c.w):''}</p><div class="grid g3">${['Warum stimmt das?','Wie hängt das mit etwas zusammen, das ich schon kenne?','Welches neue Beispiel würde ich nennen?'].map(q=>`<label class="f">${q}<textarea class="in" style="min-height:90px"></textarea></label>`).join('')}</div></section>`).join('');

}

/* Fokus */
const PRESETS=[[25,5],[40,10],[50,10]];
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function vFokus(){
  const t=ui.tm,pct=t.len?(t.len-t.left)/t.len:0,rec=peek(dnum());

  h+=`<section class="card timer"><div class="presets">${PRESETS.map((p,i)=>`<button class="chip" aria-pressed="${t.preset===i}" data-act="tmPreset" data-i="${i}">${p[0]} / ${p[1]} Min.</button>`).join('')}<button class="chip" aria-pressed="${t.preset===-1}" data-act="tmPreset" data-i="-1">Eigene</button></div>
  ${t.preset===-1?`<div class="row"><label class="f" style="width:130px">Fokus (Min.)<input class="in" id="cuF" type="number" min="5" max="120" value="${Math.round(t.flen/60)}" data-chg="tmCustom"></label><label class="f" style="width:130px">Pause (Min.)<input class="in" id="cuB" type="number" min="1" max="45" value="${t.brk}" data-chg="tmCustom"></label></div>`:''}
  <p class="eyebrow" id="tmMode">${t.mode==='foco'?'Fokus':'Pause'}</p>
  <div id="tmRingWrap">${ring(pct,260,'<span id="tmText">'+mmss(t.left)+'</span>',t.mode==='foco'?'Konzentration':'Pause')}</div>
  <div class="row" style="justify-content:center"><button class="btn primary" data-act="tmToggle" id="tmBtn">${t.running?ico('pause',18)+' Pausieren':ico('play',18)+' Starten'}</button><button class="btn ghost" data-act="tmReset">${ico('reset',18)} Zurücksetzen</button><button class="btn quiet" data-act="tmSkip">${ico('skip',18)} ${t.mode==='foco'?'Jetzt Pause':'Pause beenden'}</button></div>
  <p class="muted small">Heute konzentriert gelernt: <b class="tnum">${rec.min}</b> Min. ${t.mode==='pausa'?'In der Pause: aufstehen, Wasser trinken, in die Ferne schauen.':'Lege das Handy weg und wähle eine einzige Aufgabe.'}</p></section>`;
  h+=`<section class="card"><div class="sec-h"><h2>Wenn-dann-Pläne</h2><button class="btn quiet sm" data-act="openMethod" data-id="plaene">Zur Studie ${ico('chev',15)}</button></div><p class="muted small" style="margin-bottom:10px">Verknüpfe einen festen Moment deines Tages mit einer kleinen Handlung, zum Beispiel: „Wenn ich mit dem Mittagessen fertig bin, dann mache ich 10 Karten.“ Das macht es leichter, wirklich anzufangen.</p><form class="grid" style="grid-template-columns:1fr 1fr auto;align-items:end" data-form="plan"><label class="f">Wenn …<input class="in" id="pIf" maxlength="90" placeholder="ich mit dem Essen fertig bin" required></label><label class="f">dann …<input class="in" id="pThen" maxlength="90" placeholder="mache ich die Tageseinheit" required></label><button class="btn primary" type="submit">Hinzufügen</button></form><div style="margin-top:10px">${S.plans.length?S.plans.map((p,i)=>`<div class="plan-row"><span>Wenn <b>${esc(p.i)}</b>, dann <b>${esc(p.t)}</b>.</span><button class="btn quiet sm" data-act="delPlan" data-i="${i}" aria-label="Plan entfernen">${ico('trash',16)}</button></div>`).join(''):'<p class="muted small">Noch kein Plan angelegt.</p>'}</div></section>`;

}
function paintTimer(){
  const t=ui.tm,tx=$('#tmText');if(!tx)return;
  tx.textContent=mmss(t.left);
  const fg=$('#tmRingWrap .ring-fg');if(fg){const r=fg.getAttribute('r'),c=2*Math.PI*r;fg.setAttribute('stroke-dashoffset',(c*(1-(t.len?(t.len-t.left)/t.len:0))).toFixed(1))}
}
function tmTick(){
  const t=ui.tm;if(!t.running)return;
  t.left=Math.max(0,Math.round((t.end-Date.now())/1000));
  if(route()==='fokus')paintTimer();
  if(t.left<=0){
    t.running=false;
    if(t.mode==='foco'){dayRec().min+=Math.round(t.len/60);save();t.mode='pausa';t.len=t.brk*60;toast('Block geschafft. Zeit für die Pause.')}
    else{t.mode='foco';t.len=t.flen;toast('Pause vorbei. Bereit für den nächsten Block?')}
    t.left=t.len;if(route()==='fokus')render();
  }
}
function tmLogPartial(){const t=ui.tm;if(t.mode==='foco'){const m=Math.floor((t.len-t.left)/60);if(m>=1){dayRec().min+=m;save()}}}

/* ---------- Rendern ---------- */

  $('#tabs').innerHTML=TABS.map(n=>{const on=n[0]==='mehr'?more:r===n[0];return `<a href="#${n[0]}" class="${on?'on':''}" ${on?'aria-current="page"':''}>${ico(n[0],22)}<span>${n[1]}</span></a>`}).join('');
}
function render(){
  const r=route();buildNav();
  view.innerHTML=({heute:vHeute,lernen:vLernen,wiederholen:vWiederholen,faecher:vFaecher,quiz:vQuiz,formeln:vFormeln,erklaeren:vErklaeren,fokus:vFokus,methoden:vMethoden,einstellungen:vEinstellungen,mehr:vMehr})[r]();

function paintExClock(){

  qzRetry:()=>{const z=ui.qz;if(!z||!z.wrong.length)return;ui.qz={list:shuf(z.wrong),i:0,picked:null,ok:0,wrong:[]};render();window.scrollTo(0,0)},
  newSubj:()=>{ui.newSubj=!ui.newSubj;ui.focus='nsName';render()},
  openSubj:el=>{ui.subj=el.dataset.id;ui.q='';ui.edit=null;ui.confirm='';go('faecher');window.scrollTo(0,0)},

  },

function copyText(txt,msg){
  const done=()=>toast(msg);
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);return}}catch(e){}
  fallback();
  function fallback(){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);if(ok)done();else toast('Kopieren nicht möglich. Markiere den Text und kopiere ihn von Hand.')}catch(e){toast('Kopieren nicht möglich. Markiere den Text und kopiere ihn von Hand.')}}
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});

  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form;
  if(k==='name'){S.name=$('#nameIn').value.trim();save();render()}
  else if(k==='newSubj'){
    const n=$('#nsName').value.trim();if(!n)return;
    const s={id:uid(),name:n,exam:$('#nsExam').value||'',hue:HUES[S.subjects.length%HUES.length]};
    S.subjects.push(s);ui.newSubj=false;ui.subj=s.id;ui.q='';save();render();toast('Fach angelegt. Füge die ersten Karten hinzu.');ui.focus='nq';render();
  }
  else if(k==='addCard'){
    const q=$('#nq').value.trim(),a=$('#na').value.trim();if(!q||!a)return;
    S.cards.push(newCard(ui.subj,q,a,$('#nw').value.trim(),$('#nt').value.trim()));save();ui.focus='nq';render();toast('Karte hinzugefügt.');
  }
  else if(k==='editCard'){
    const c=byId(f.dataset.id);if(!c)return;
    c.q=$('#eq').value.trim()||c.q;c.a=$('#ea').value.trim()||c.a;c.w=$('#ew').value.trim();c.t=$('#et').value.trim();ui.edit=null;save();render();
  }
  else if(k==='plan'){
    const i=$('#pIf').value.trim(),t=$('#pThen').value.trim();if(!i||!t)return;S.plans.push({i:i,t:t});save();render();
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg;
  if(k==='cfgSid'){ui.cfg.sid=el.value;render()}
  else if(k==='sName'){const s=subj(ui.subj);if(s&&el.value.trim()){s.name=el.value.trim();save();render()}}
  else if(k==='sExam'){const s=subj(ui.subj);if(s){s.exam=el.value||'';save();render()}}
  else if(k==='sHue'){const s=subj(ui.subj);if(s){s.hue=el.value;save();render()}}
  else if(k==='setName'){S.name=el.value.trim();save();toast('Name gespeichert.')}
  else if(k==='setNew'){S.set.newPerDay=+el.value;save();toast('Gespeichert.')}
  else if(k==='exSid'){const t=$('#exTopic');if(t)t.innerHTML='<option value="">Alle</option>'+topicsOf(el.value).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
  else if(k==='exCheck'){ui.ex.checked[el.dataset.id]=el.checked;const n=Object.keys(ui.ex.checked).filter(x=>ui.ex.checked[x]).length;const c=$('#exCount');if(c)c.textContent=n+' von '+S.cards.filter(c2=>c2.sid===ui.ex.sid&&(!ui.ex.topic||c2.t===ui.ex.topic)).length}
  else if(k==='tmCustom'){
    const f=Math.max(5,Math.min(120,+$('#cuF').value||25)),b=Math.max(1,Math.min(45,+$('#cuB').value||5)),t=ui.tm;
    t.running=false;t.preset=-1;t.mode='foco';t.len=f*60;t.flen=t.len;t.brk=b;t.left=t.len;render();
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-in]');if(!el)return;const k=el.dataset.in;
  if(k==='attempt'&&ui.ses)ui.ses.attempt=el.value;
  else if(k==='exText'&&ui.ex)ui.ex.text=el.value;
  else if(k==='search'){ui.q=el.value;const s=subj(ui.subj),l=$('#clist');if(s&&l)l.innerHTML=cardRows(s)}
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(document.activeElement||{}).tagName,typing=tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT';
  if(typing)return;
  if(route()==='quiz'&&ui.qz&&ui.qz.list&&ui.qz.i<ui.qz.list.length){
    const z=ui.qz,q=QUIZ[z.list[z.i]];
    if(z.picked==null){const k='1234'.indexOf(e.key);const l='abcd'.indexOf((e.key||'').toLowerCase());const x=k>=0?k:(e.key&&e.key.length===1?l:-1);if(x>=0&&x<q[2].length){e.preventDefault();qzPick(x)}}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();qzNext()}
    return;
  }
  if(route()==='lernen'&&ui.lp){
    const z=ui.lp,st=z.s<LP[z.k].steps.length?LP[z.k].steps[z.s]:null;
    if(!st){if(e.key==='Enter'){e.preventDefault();lpEnd()}return}
    if(st.t==='c'&&z.picked==null){const x='1234'.indexOf(e.key),l=(e.key||'').length===1?'abcd'.indexOf(e.key.toLowerCase()):-1,y=x>=0?x:l;if(y>=0&&y<st.o.length){e.preventDefault();lpPick(y)}}
    else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();lpGo()}
    else if(e.key==='ArrowLeft'){e.preventDefault();lpBack()}
    return;
  }
  const s=ui.ses;
  if(!s||route()!=='wiederholen'||s.i>=s.q.length)return;
  const c=cur(),fresh=c&&!c.seen&&!s.lrn[c.id],learn=fresh&&s.mode==='day'&&S.set.learnFirst!==false;
  if(learn&&s.stage==='q'){if(e.key==='Enter'||e.key===' '){e.preventDefault();doLearn()}return}
  if(s.stage==='q'){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();doReveal(null)}
    else if(!fresh&&['1','2','3'].indexOf(e.key)>=0){e.preventDefault();const a=$('#attempt');if(a)s.attempt=a.value;doReveal(['g','a','c'][+e.key-1])}
  }else if(['1','2','3','4'].indexOf(e.key)>=0){e.preventDefault();doGrade(+e.key-1)}
});
$('#themeBtn').addEventListener('click',()=>{
  const dark=S.theme?S.theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  S.theme=dark?'light':'dark';save();applyTheme();
});
window.addEventListener('hashchange',()=>{
  if(ui.ses&&ui.ses.i>=ui.ses.q.length&&route()!=='wiederholen')ui.ses=null;
  window.scrollTo(0,0);render();
});
setInterval(()=>{tmTick();if(ui.ex&&ui.ex.step===1&&route()==='erklaeren')paintExClock()},500);

applyTheme();
render();
})();
</script>
</body>
</html>
